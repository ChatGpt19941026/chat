<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Icon Maker</title>
<style>
body{font-family:system-ui,sans-serif;text-align:center;padding:20px;background:#f3f4f6}
canvas{width:256px;height:256px;border:1px solid #ccc;background:#fff}
button{display:block;width:100%;max-width:300px;margin:12px auto;padding:14px;border:0;border-radius:10px;
  background:#f59e0b;color:#fff;font-size:16px}
</style>
</head>
<body>
<h3>নোটপ্যাড আইকন</h3>
<canvas id="pv" width="512" height="512"></canvas>
<button id="b192">icon-192.png ডাউনলোড</button>
<button id="b512">icon-512.png ডাউনলোড</button>
<script>
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function draw(canvas, size) {
  canvas.width = size; canvas.height = size;
  const c = canvas.getContext("2d");
  const s = size / 512;
  c.setTransform(s, 0, 0, s, 0, 0);
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, 512, 512);

  // লাল মলাট
  c.save();
  c.shadowColor = "rgba(0,0,0,.3)"; c.shadowBlur = 14; c.shadowOffsetY = 6;
  const g = c.createLinearGradient(96, 0, 416, 0);
  g.addColorStop(0, "#9a2410"); g.addColorStop(.5, "#c0391f"); g.addColorStop(1, "#8a1f0d");
  rr(c, 96, 52, 320, 424, 26); c.fillStyle = g; c.fill();
  c.restore();

  // উপরের কালো পট্টি
  rr(c, 96, 52, 320, 34, 10); c.fillStyle = "#2f2f2f"; c.fill();

  // সাদা পাতা
  rr(c, 116, 92, 280, 362, 14); c.fillStyle = "#f7fafc"; c.fill();

  // নীল লাইন
  c.strokeStyle = "#7ec8f0"; c.lineWidth = 2.5;
  for (let y = 140; y <= 440; y += 30) {
    c.beginPath(); c.moveTo(116, y); c.lineTo(396, y); c.stroke();
  }
  // লাল মার্জিন
  c.strokeStyle = "#f2a0a0"; c.lineWidth = 2;
  c.beginPath(); c.moveTo(152, 92); c.lineTo(152, 454); c.stroke();
  c.beginPath(); c.moveTo(158, 92); c.lineTo(158, 454); c.stroke();

  // স্পাইরাল রিং
  for (let i = 0; i < 8; i++) {
    const x = 142 + i * (228 / 7);
    const rg = c.createLinearGradient(x - 8, 0, x + 8, 0);
    rg.addColorStop(0, "#9ca3af"); rg.addColorStop(.5, "#f3f4f6"); rg.addColorStop(1, "#6b7280");
    rr(c, x - 8, 56, 16, 66, 8); c.fillStyle = rg; c.fill();
    c.strokeStyle = "#6b7280"; c.lineWidth = 1.5; c.stroke();
    c.beginPath(); c.arc(x, 104, 4.5, 0, Math.PI * 2); c.fillStyle = "#3b3b3b"; c.fill();
  }
}
draw($("pv") , 512);
function $(id) { return document.getElementById(id); }
function save(size, name) {
  const cv = document.createElement("canvas");
  draw(cv, size);
  cv.toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }, "image/png");
}
$("b192").onclick = () => save(192, "icon-192.png");
$("b512").onclick = () => save(512, "icon-512.png");
</script>
</body>
</html>
