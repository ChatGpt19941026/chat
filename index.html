<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>My Notes</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --surface-3: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.16);
      --accent: #10b981;
      --accent-dark: #059669;
      --bubble-me: #065f46;
      --bubble-other: #1e293b;
      --danger: #ef4444;
      --warning: #f59e0b;
      --seen: #38bdf8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
      overflow: hidden;
      user-select: none;
    }

    button, input, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .screen {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      position: relative;
      background: var(--bg);
    }

    .screen.active {
      display: flex;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(10px + var(--safe-top)) 12px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      min-height: 58px;
      z-index: 20;
      gap: 8px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .topbar-title {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-sub {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text);
      flex-shrink: 0;
    }

    .icon-btn:active {
      background: var(--surface-2);
    }

    /* Notepad */
    .note-editor-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }

    .note-title-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      font-weight: 600;
      outline: none;
      user-select: text;
    }

    .note-body-input {
      flex: 1;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      line-height: 1.6;
      resize: none;
      outline: none;
      user-select: text;
    }

    .note-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px calc(6px + var(--safe-bottom));
      color: var(--muted);
      font-size: 12px;
    }

    .btn-primary {
      background: var(--accent);
      color: #04130d;
      font-weight: 700;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary:active {
      background: var(--accent-dark);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
      font-weight: 600;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
    }

    /* Dropdown menu */
    .menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 60;
      display: none;
    }

    .menu-backdrop.open {
      display: block;
    }

    .dropdown-menu {
      position: fixed;
      top: calc(56px + var(--safe-top));
      right: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      min-width: 210px;
      padding: 6px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.55);
      z-index: 65;
      display: none;
      flex-direction: column;
    }

    .dropdown-menu.open {
      display: flex;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      text-align: left;
      font-size: 14px;
      width: 100%;
    }

    .menu-item:active {
      background: var(--surface-3);
    }

    /* Saved Notes Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 80;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 460px;
      max-height: 82dvh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
    }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .saved-note-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .saved-note-title {
      font-weight: 700;
      font-size: 15px;
    }

    .saved-note-preview {
      font-size: 13px;
      color: var(--muted);
      white-space: pre-wrap;
      max-height: 76px;
      overflow: hidden;
    }

    .saved-note-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    /* Auth & PIN screens */
    .center-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 22px;
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      user-select: text;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 8px 0;
    }

    .pin-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      background: transparent;
    }

    .pin-dot.filled {
      background: var(--accent);
      border-color: var(--accent);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 6px;
    }

    .key-btn {
      height: 54px;
      border-radius: 14px;
      background: var(--surface-2);
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .key-btn:active {
      background: var(--surface-3);
    }

    /* Chat settings bar */
    .chat-settings-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: rgba(17, 24, 39, 0.94);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill-btn.active-mode {
      background: rgba(16, 185, 129, 0.18);
      border-color: var(--accent);
      color: #6ee7b7;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #64748b;
      display: inline-block;
    }

    .status-dot.online {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.7);
    }

    /* Messages area */
    .messages-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .empty-chat-banner {
      margin: auto;
      text-align: center;
      color: var(--muted);
      white-space: pre-line;
      font-size: 15px;
      line-height: 1.65;
      padding: 20px;
    }

    .date-divider {
      align-self: center;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 999px;
      margin: 6px 0;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
    }

    .msg-row.me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.other {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
      position: relative;
      user-select: text;
    }

    .msg-row.me .bubble {
      background: var(--bubble-me);
      border-bottom-right-radius: 4px;
    }

    .msg-row.other .bubble {
      background: var(--bubble-other);
      border-bottom-left-radius: 4px;
    }

    .reply-quote {
      background: rgba(0, 0, 0, 0.24);
      border-left: 3px solid var(--accent);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 12px;
      color: #e2e8f0;
      margin-bottom: 6px;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      padding: 0 4px;
    }

    .ticks.seen {
      color: var(--seen);
      font-weight: 700;
    }

    .burn-timer {
      color: #f87171;
      font-weight: 700;
    }

    .reactions-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 3px;
    }

    .reaction-chip {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 12px;
    }

    .media-img {
      max-width: 230px;
      max-height: 260px;
      border-radius: 12px;
      display: block;
      cursor: pointer;
    }

    .media-video {
      max-width: 240px;
      max-height: 260px;
      border-radius: 12px;
      display: block;
      background: #000;
    }

    .media-open-btn {
      margin-top: 6px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Reply & Composer */
    .reply-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--surface-2);
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    .reply-bar.active {
      display: flex;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 8px 10px calc(8px + var(--safe-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .composer-input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 14px;
      font-size: 15px;
      max-height: 110px;
      resize: none;
      outline: none;
      user-select: text;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent);
      color: #04130d;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Call overlay */
    .call-overlay {
      position: fixed;
      inset: 0;
      background: #060a13;
      z-index: 95;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(24px + var(--safe-top)) 20px calc(28px + var(--safe-bottom));
    }

    .call-overlay.active {
      display: flex;
    }

    .call-overlay.minimized {
      inset: auto 14px calc(74px + var(--safe-bottom)) auto;
      width: 170px;
      height: 110px;
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 30px rgba(0,0,0,0.65);
    }

    .video-grid {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 18px;
      background: #0f172a;
      margin: 14px 0;
    }

    video {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
    }

    .local-pip {
      position: absolute;
      width: 105px;
      height: 145px;
      right: 12px;
      bottom: 12px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.35);
      background: #000;
    }

    .call-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .call-circle-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--surface-2);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .call-circle-btn.end {
      background: var(--danger);
      color: #fff;
    }

    .call-circle-btn.accept {
      background: var(--accent);
      color: #04130d;
    }

    /* Fullscreen media viewer */
    .viewer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .viewer-overlay.open {
      display: flex;
    }

    .viewer-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: auto;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(84px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.96);
      color: #fff;
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 120;
      display: none;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      display: block;
    }
  </style>
</head>
<body>

  <!-- 1. NOTEPAD SCREEN (Default entry) -->
  <section id="notepadScreen" class="screen active">
    <header class="topbar">
      <div class="topbar-left">
        <div>
          <div id="noteAppTitle" class="topbar-title">My Notes</div>
          <div id="noteSubStatus" class="topbar-sub">লোকাল নোটপ্যাড</div>
        </div>
      </div>
      <button id="noteMenuBtn" class="icon-btn" aria-label="Menu">⋮</button>
    </header>

    <div class="note-editor-wrap">
      <input id="noteTitleInput" class="note-title-input" type="text" placeholder="নোটের শিরোনাম..." />
      <textarea id="noteBodyInput" class="note-body-input" placeholder="এখানে আপনার নোট লিখুন..."></textarea>
      <div class="note-footer">
        <span id="noteSaveHint">অটো-সেভ প্রস্তুত</span>
        <button id="saveNoteBtn" class="btn-primary">সেভ করুন</button>
      </div>
    </div>
  </section>

  <!-- Dropdown Menu -->
  <div id="menuBackdrop" class="menu-backdrop"></div>
  <div id="dropdownMenu" class="dropdown-menu">
    <button id="menuNewNote" class="menu-item">📝 নতুন নোট</button>
    <button id="menuOldNotes" class="menu-item">📚 পুরোনো নোট দেখুন</button>
    <button id="menuSettings" class="menu-item">⚙️ সেটিংস</button>
    <button id="menuToolbox" class="menu-item">🧰 টুলবক্স</button>
  </div>

  <!-- 2. LOGIN SCREEN -->
  <section id="loginScreen" class="screen">
    <header class="topbar">
      <div class="topbar-left">
        <button id="loginBackToNotesBtn" class="icon-btn">←</button>
        <div class="topbar-title">অ্যাকাউন্ট লগইন</div>
      </div>
    </header>
    <div class="center-box">
      <div class="card">
        <div style="font-weight:700;font-size:17px;">প্রাইভেট সাইন-ইন</div>
        <div style="font-size:13px;color:var(--muted);">অনুমোদিত ইমেইল ও পাসওয়ার্ড দিয়ে প্রবেশ করুন।</div>
        <input id="loginEmailInput" class="field-input" type="email" autocomplete="username" placeholder="ইমেইল ঠিকানা" />
        <input id="loginPasswordInput" class="field-input" type="password" autocomplete="current-password" placeholder="পাসওয়ার্ড" />
        <button id="loginSubmitBtn" class="btn-primary">লগইন করুন</button>
        <div id="loginErrorMsg" style="color:#fca5a5;font-size:13px;min-height:18px;"></div>
      </div>
    </div>
  </section>

  <!-- 3. PIN / BIOMETRIC LOCK SCREEN -->
  <section id="pinScreen" class="screen">
    <header class="topbar">
      <div class="topbar-left">
        <button id="pinBackToNotesBtn" class="icon-btn">←</button>
        <div id="pinHeaderTitle" class="topbar-title">৪-সংখ্যার PIN</div>
      </div>
    </header>
    <div class="center-box">
      <div class="card">
        <div id="pinInstruction" style="text-align:center;font-weight:600;font-size:15px;">PIN দিন</div>
        <div id="pinDots" class="pin-dots">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>
        <div id="pinStatusText" style="text-align:center;font-size:13px;color:var(--muted);min-height:18px;"></div>

        <div class="keypad">
          <button class="key-btn" data-key="1">1</button>
          <button class="key-btn" data-key="2">2</button>
          <button class="key-btn" data-key="3">3</button>
          <button class="key-btn" data-key="4">4</button>
          <button class="key-btn" data-key="5">5</button>
          <button class="key-btn" data-key="6">6</button>
          <button class="key-btn" data-key="7">7</button>
          <button class="key-btn" data-key="8">8</button>
          <button class="key-btn" data-key="9">9</button>
          <button id="biometricUnlockBtn" class="key-btn" style="font-size:15px;">👆</button>
          <button class="key-btn" data-key="0">0</button>
          <button id="pinBackspaceBtn" class="key-btn">⌫</button>
        </div>

        <button id="setupBiometricBtn" class="btn-secondary" style="display:none;margin-top:6px;">
          👆 ফিঙ্গারপ্রিন্ট চালু করুন
        </button>
      </div>
    </div>
  </section>

  <!-- 4. CHAT SCREEN -->
  <section id="chatScreen" class="screen">
    <header class="topbar">
      <div class="topbar-left">
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="topbar-title">Chat Gpt 2.0</span>
            <span id="peerOnlineDot" class="status-dot"></span>
          </div>
          <div id="peerPresenceText" class="topbar-sub">অফলাইন</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:2px;">

    // ------------------ NOTEPAD LOGIC ------------------
    function getNotes() {
      try {
        return JSON.parse(localStorage.getItem(LS_NOTES) || "[]");

    }

    function setNotes(list) {
      localStorage.setItem(LS_NOTES, JSON.stringify(list));
    }

    function saveCurrentNote(silent = false) {
      const title = $("noteTitleInput").value.trim() || "শিরোনামহীন নোট";
      const body = $("noteBodyInput").value;
      if (!body.trim() && !title.trim()) return;

      const notes = getNotes();
      const now = Date.now();
      if (activeNoteId) {
        const idx = notes.findIndex((n) => n.id === activeNoteId);
        if (idx >= 0) {
          notes[idx] = { ...notes[idx], title, body, updatedAt: now };
        } else {
          activeNoteId = "note_" + now;
          notes.unshift({ id: activeNoteId, title, body, updatedAt: now });
        }
      } else {
        activeNoteId = "note_" + now;
        notes.unshift({ id: activeNoteId, title, body, updatedAt: now });
      }
      localStorage.setItem(LS_ACTIVE_NOTE, activeNoteId);
      setNotes(notes);
      $("noteSaveHint").textContent = "সেভ হয়েছে";
      if (!silent) showToast("নোট সেভ হয়েছে");
    }

    function startNewNote() {
      activeNoteId = null;
      localStorage.removeItem(LS_ACTIVE_NOTE);
      $("noteTitleInput").value = "";
      $("noteBodyInput").value = "";
      $("noteSaveHint").textContent = "নতুন নোট";
    }

    function openSavedNotesModal() {
      const notes = getNotes();

          item.className = "saved-note-item";
          item.innerHTML = `
            <div class="saved-note-title">${escapeHtml(n.title)}</div>
            <div class="saved-note-preview">${escapeHtml(n.body)}</div>

              <button class="btn-secondary" data-open-note="${n.id}">খুলুন</button>
              <button class="btn-danger" data-del-note="${n.id}">মুছুন</button>
            </div>
          `;
          body.appendChild(item);
        });
      }
      $("modalOverlay").classList.add("open");
    }

    function openNotepadSettingsModal() {
      $("modalTitle").textContent = "সেটিংস";
      const hasPin = !!localStorage.getItem(LS_PIN_HASH);
      $("modalBody").innerHTML = `
        <div class="saved-note-item">
          <div style="font-weight:700;">PIN স্ট্যাটাস</div>
          <div style="font-size:13px;color:var(--muted);">${hasPin ? "৪-সংখ্যার PIN সেট করা আছে" : "PIN এখনো সেট করা হয়নি"}</div>
          <div style="display:flex;gap:8px;margin-top:6px;">
            <button id="modalResetPinBtn" class="btn-secondary">PIN পরিবর্তন করুন</button>
          </div>
        </div>
        <div class="saved-note-item">
          <div style="font-weight:700;">অ্যাপ তথ্য</div>
          <div style="font-size:13px;color:var(--muted);">ভার্সন: ${APP_VERSION}</div>
        </div>
      `;
      $("modalOverlay").classList.add("open");
      $("modalResetPinBtn").onclick = () => {
        $("modalOverlay").classList.remove("open");
        startPinFlow("setup");
        showScreen("pinScreen");
      };
    }

    $("modalBody").addEventListener("click", (e) => {
      const openId = e.target.getAttribute("data-open-note");
      const delId = e.target.getAttribute("data-del-note");
      if (openId) {
        const note = getNotes().find((n) => n.id === openId);
        if (note) {
          activeNoteId = note.id;
          localStorage.setItem(LS_ACTIVE_NOTE, note.id);
          $("noteTitleInput").value = note.title;
          $("noteBodyInput").value = note.body;
          $("noteSaveHint").textContent = "লোড হয়েছে";
        }
        $("modalOverlay").classList.remove("open");
      } else if (delId) {
        const filtered = getNotes().filter((n) => n.id !== delId);
        setNotes(filtered);
        if (activeNoteId === delId) startNewNote();
        openSavedNotesModal();
        showToast("নোট মোছা হয়েছে");
      }
    });

    $("closeModalBtn").addEventListener("click", () => $("modalOverlay").classList.remove("open"));
    $("saveNoteBtn").addEventListener("click", () => saveCurrentNote(false));
    $("noteTitleInput").addEventListener("input", () => {
      $("noteSaveHint").textContent = "সেভ হচ্ছে...";
      clearTimeout(saveCurrentNote._t);
      saveCurrentNote._t = setTimeout(() => saveCurrentNote(true), 500);
    });
    $("noteBodyInput").addEventListener("input", () => {
      $("noteSaveHint").textContent = "সেভ হচ্ছে...";
      clearTimeout(saveCurrentNote._t);
      saveCurrentNote._t = setTimeout(() => saveCurrentNote(true), 500);

    $("noteMenuBtn").addEventListener("click", () => {

      else openDropdown();

    $("menuNewNote").addEventListener("click", () => {

      startNewNote();
      showToast("নতুন নোট তৈরি হয়েছে");
    });

    $("menuOldNotes").addEventListener("click", () => {
      closeDropdown();
      openSavedNotesModal();
    });

    $("menuSettings").addEventListener("click", () => {
      closeDropdown();
      openNotepadSettingsModal();
    });

    // Toolbox -> Login / PIN / Chat
    $("menuToolbox").addEventListener("click", async () => {
      closeDropdown();
      saveCurrentNote(true);
      if (!auth.currentUser) {
        showScreen("loginScreen");
        return;
      }
      await enterProtectedChatFlow();
    });

    // ------------------ AUTH & PIN / BIOMETRIC ------------------
    $("loginBackToNotesBtn").addEventListener("click", () => showScreen("notepadScreen"));

    $("loginSubmitBtn").addEventListener("click", async () => {
      const email = $("loginEmailInput").value.trim();
      const pass = $("loginPasswordInput").value;
      $("loginErrorMsg").textContent = "";
      if (!email || !pass) {
        $("loginErrorMsg").textContent = "ইমেইল ও পাসওয়ার্ড দিন।";
        return;
      }
      try {
        $("loginSubmitBtn").disabled = true;
        await signInWithEmailAndPassword(auth, email, pass);
        $("loginPasswordInput").value = "";

      } catch (err) {

      } finally {
        $("loginSubmitBtn").disabled = false;
      }
    });

    async function sha256Hex(str) {
      const buf = new TextEncoder().encode(str);
      const hashBuf = await crypto.subtle.digest("SHA-256", buf);
      return Array.from(new Uint8Array(hashBuf))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }

    function updatePinDots() {
      const dots = $("pinDots").querySelectorAll(".pin-dot");
      dots.forEach((d, i) => d.classList.toggle("filled", i < pinInput.length));
    }

    function startPinFlow(mode) {
      pinMode = mode;
      pinInput = "";
      pendingPinFirst = "";
      updatePinDots();
      $("pinStatusText").textContent = "";
      $("setupBiometricBtn").style.display = window.PublicKeyCredential ? "inline-flex" : "none";

      if (mode === "setup") {
        $("pinHeaderTitle").textContent = "নতুন ৪-সংখ্যার PIN";
        $("pinInstruction").textContent = "একটি ৪-সংখ্যার PIN তৈরি করুন";
      } else if (mode === "confirm") {
        $("pinHeaderTitle").textContent = "PIN নিশ্চিত করুন";
        $("pinInstruction").textContent = "একই PIN আবার দিন";
      } else {
        $("pinHeaderTitle").textContent = "PIN আনলক";
        $("pinInstruction").textContent = "আপনার ৪-সংখ্যার PIN দিন";
      }
    }

    async function enterProtectedChatFlow() {
      const storedHash = localStorage.getItem(LS_PIN_HASH);
      const unlocked = sessionStorage.getItem(LS_PIN_UNLOCKED) === "1";

      if (!storedHash) {
        startPinFlow("setup");
        showScreen("pinScreen");
        return;
      }

      if (unlocked) {
        await openChatWorkspace();
        return;
      }

      startPinFlow("verify");
      showScreen("pinScreen");
      if (localStorage.getItem(LS_WEBAUTHN_CRED) && window.PublicKeyCredential) {
        attemptBiometricUnlock(true);
      }
    }

    $("pinBackToNotesBtn").addEventListener("click", () => {
      pinInput = "";
      updatePinDots();
      showScreen("notepadScreen");
    });

    document.querySelectorAll(".key-btn[data-key]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const lockUntil = Number(localStorage.getItem(LS_PIN_LOCK_UNTIL) || "0");
        if (Date.now() < lockUntil) {
          const sec = Math.ceil((lockUntil - Date.now()) / 1000);
          $("pinStatusText").textContent = `${sec} সেকেন্ড পর আবার চেষ্টা করুন।`;
          return;
        }
        if (pinInput.length >= 4) return;
        pinInput += btn.getAttribute("data-key");
        updatePinDots();

        if (pinInput.length === 4) {
          await handleCompletedPin(pinInput);
        }
      });
    });

    $("pinBackspaceBtn").addEventListener("click", () => {
      pinInput = pinInput.slice(0, -1);
      updatePinDots();
    });

    async function handleCompletedPin(code) {
      if (pinMode === "setup") {
        pendingPinFirst = code;
        pinInput = "";
        updatePinDots();
        startPinFlow("confirm");
        return;
      }

      if (pinMode === "confirm") {
        if (code !== pendingPinFirst) {
          pinInput = "";
          pendingPinFirst = "";
          updatePinDots();
          $("pinStatusText").textContent = "PIN মেলেনি। আবার শুরু করুন।";
          pinMode = "setup";
          $("pinInstruction").textContent = "নতুন ৪-সংখ্যার PIN তৈরি করুন";
          return;
        }
        const h = await sha256Hex(code);
        localStorage.setItem(LS_PIN_HASH, h);
        localStorage.setItem(LS_PIN_FAILS, "0");
        localStorage.removeItem(LS_PIN_LOCK_UNTIL);
        sessionStorage.setItem(LS_PIN_UNLOCKED, "1");
        pinInput = "";
        updatePinDots();
        showToast("PIN সেট হয়েছে");
        await openChatWorkspace();
        return;
      }

      // verify
      const h = await sha256Hex(code);
      const expected = localStorage.getItem(LS_PIN_HASH);
      if (h === expected) {
        localStorage.setItem(LS_PIN_FAILS, "0");
        localStorage.removeItem(LS_PIN_LOCK_UNTIL);
        sessionStorage.setItem(LS_PIN_UNLOCKED, "1");
        pinInput = "";
        updatePinDots();
        await openChatWorkspace();
      } else {
        const fails = Number(localStorage.getItem(LS_PIN_FAILS) || "0") + 1;
        localStorage.setItem(LS_PIN_FAILS, String(fails));
        pinInput = "";
        updatePinDots();
        if (fails >= 5) {
          const until = Date.now() + PIN_LOCKOUT_MS;
          localStorage.setItem(LS_PIN_LOCK_UNTIL, String(until));
          localStorage.setItem(LS_PIN_FAILS, "0");
          $("pinStatusText").textContent = "৫ বার ভুল PIN! ৩০ সেকেন্ড লক করা হয়েছে।";
        } else {
          $("pinStatusText").textContent = `ভুল PIN (${fails}/5)`;
        }
      }
    }

    // WebAuthn fingerprint support
    $("setupBiometricBtn").addEventListener("click", async () => {
      if (!window.PublicKeyCredential) {
        showToast("এই ডিভাইসে বায়োমেট্রিক সমর্থিত নয়");
        return;
      }
      try {
        const challenge = crypto.getRandomValues(new Uint8Array(32));
        const userId = crypto.getRandomValues(new Uint8Array(16));
        const cred = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: { name: "My Notes" },
            user: {
              id: userId,
              name: "private_user",
              displayName: "Private User"
            },
            pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
            timeout: 60000
          }
        });
        if (cred && cred.rawId) {
          const b64 = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
          localStorage.setItem(LS_WEBAUTHN_CRED, b64);
          showToast("ফিঙ্গারপ্রিন্ট যুক্ত হয়েছে");
        }
      } catch {
        showToast("ফিঙ্গারপ্রিন্ট সেটআপ বাতিল হয়েছে");
      }
    });

    async function attemptBiometricUnlock(silentFail = false) {
      const credB64 = localStorage.getItem(LS_WEBAUTHN_CRED);
      if (!credB64 || !window.PublicKeyCredential) return;
      try {
        const rawId = Uint8Array.from(atob(credB64), (c) => c.charCodeAt(0));
        const challenge = crypto.getRandomValues(new Uint8Array(32));
        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge,
            allowCredentials: [{ id: rawId, type: "public-key" }],
            userVerification: "required",
            timeout: 60000
          }
        });
        if (assertion) {
          localStorage.setItem(LS_PIN_FAILS, "0");
          localStorage.removeItem(LS_PIN_LOCK_UNTIL);
          sessionStorage.setItem(LS_PIN_UNLOCKED, "1");
          await openChatWorkspace();
        }
      } catch {
        if (!silentFail) {
          $("pinStatusText").textContent = "ফিঙ্গারপ্রিন্ট মেলেনি, PIN দিন।";
        }
      }
    }

    function subscribeMessages() {
      if (messagesUnsub) messagesUnsub();
      const q = query(
        collection(db, "chats", CHAT_ID, "messages"),
        orderBy("createdAt", "desc"),
        limit(PAGE_SIZE)
      );

      messagesUnsub = onSnapshot(q, async (snap) => {
        const docs = snap.docs.reverse();
        oldestDocSnap = snap.docs.length ? snap.docs[snap.docs.length - 1] : null;
        $("loadOlderWrap").style.display = snap.docs.length >= PAGE_SIZE ? "block" : "none";

        liveMessages = docs.map((d) => ({ id: d.id, ...d.data() }));

        // Mark incoming messages as delivered / seen when chat is active
        if (currentUser && $("chatScreen").classList.contains("active")) {
          for (const m of liveMessages) {
            if (m.senderId && m.senderId !== currentUser.uid && m.status !== "seen") {
              updateDoc(doc(db, "chats", CHAT_ID, "messages", m.id), {
                status: "seen",
                seenAt: Date.now()
              }).catch(() => {});
            }
          }
        }
        renderMessages();
      });
    }

    $("loadOlderBtn").addEventListener("click", async () => {
      if (!oldestDocSnap) return;
      const q = query(
        collection(db, "chats", CHAT_ID, "messages"),
        orderBy("createdAt", "desc"),
        startAfter(oldestDocSnap),
        limit(PAGE_SIZE)
      );
      const snap = await getDocs(q);
      if (snap.empty) {
        $("loadOlderWrap").style.display = "none";
        return;
      }
      oldestDocSnap = snap.docs[snap.docs.length - 1];
      const fetched = snap.docs.reverse().map((d) => ({ id: d.id, ...d.data() }));
      const existingIds = new Set(olderMessages.map((x) => x.id));
      fetched.forEach((x) => {
        if (!existingIds.has(x.id)) olderMessages.push(x);
      });
      renderMessages();
    });

    function getAllVisibleMessages() {
      const map = new Map();
      [...olderMessages, ...liveMessages].forEach((m) => map.set(m.id, m));
      const uid = currentUser ? currentUser.uid : "";
      return Array.from(map.values()).filter((m) => {
        const hidden = Array.isArray(m.hiddenFor) && m.hiddenFor.includes(uid);
        return !hidden;
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderMessages() {
      const listEl = $("messagesList");
      const bannerEl = $("emptyChatBanner");
      const msgs = getAllVisibleMessages();

      bannerEl.style.display = msgs.length === 0 ? "block" : "none";
      listEl.innerHTML = "";

      let lastDateKey = "";
      const now = Date.now();

      msgs.forEach((m) => {
        const createdMs = m.createdAt?.toMillis ? m.createdAt.toMillis() : (typeof m.createdAt === "number" ? m.createdAt : now);
        const dt = new Date(createdMs);
        const dateKey = dt.toLocaleDateString();

        if (dateKey !== lastDateKey) {
          lastDateKey = dateKey;
          const div = document.createElement("div");
          div.className = "date-divider";
          div.textContent = dt.toLocaleDateString(lang === "bn" ? "bn-BD" : "en-US", {
            day: "numeric",
            month: "short",
            year: "numeric"
          });
          listEl.appendChild(div);
        }

        const isMe = currentUser && m.senderId === currentUser.uid;
        const row = document.createElement("div");
        row.className = `msg-row ${isMe ? "me" : "other"}`;

        let burnHtml = "";
        if (autoDeleteEnabled && m.seenAt) {
          const remMs = AUTO_DELETE_MS - (now - m.seenAt);
          if (remMs <= 0) {
            deleteMessageAndMedia(m);
            return;
          }
          burnHtml = `<span class="burn-timer">⏱️ ${Math.ceil(remMs / 1000)}s</span>`;
        }

        let replyHtml = "";
        if (m.replyTo) {
          replyHtml = `<div class="reply-quote">${escapeHtml(m.replyTo)}</div>`;
        }

        let contentHtml = "";
        if (m.type === "call") {
          contentHtml = `<div>📞 ${escapeHtml(m.callType || "কল")} • ${escapeHtml(m.result || "শেষ হয়েছে")}${m.duration ? ` (${escapeHtml(m.duration)})` : ""}</div>`;
        } else if (m.type === "image") {
          contentHtml = `
            <img class="media-img" data-media-id="${escapeHtml(m.mediaId || "")}" data-media-type="image" src="" alt="ছবি" />
            ${m.text ? `<div style="margin-top:6px;">${escapeHtml(m.text)}</div>` : ""}
          `;
        } else if (m.type === "audio") {
          contentHtml = `
            <audio controls preload="metadata" data-media-id="${escapeHtml(m.mediaId || "")}" style="max-width:220px;"></audio>
          `;
        } else if (m.type === "video") {
          contentHtml = `
            <video class="media-video" controls playsinline preload="metadata" data-media-id="${escapeHtml(m.mediaId || "")}"></video>
            <button class="media-open-btn" data-open-media-id="${escapeHtml(m.mediaId || "")}" data-media-type="video">⛶ ফুল-স্ক্রিন</button>
          `;
        } else {
          contentHtml = `<div>${escapeHtml(m.text || "")}</div>`;
        }

        let ticksHtml = "";
        if (isMe && m.type !== "call") {
          if (m.status === "seen") {
            ticksHtml = `<span class="ticks seen">✓✓</span>`;
          } else if (m.status === "delivered") {
            ticksHtml = `<span class="ticks">✓✓</span>`;
          } else {
            ticksHtml = `<span class="ticks">✓</span>`;
          }
        }

        const timeText = dt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

        let reactionsHtml = "";
        if (m.reactions && typeof m.reactions === "object") {
          const entries = Object.entries(m.reactions).filter(([, emoji]) => !!emoji);
          if (entries.length) {
            reactionsHtml = `<div class="reactions-row">${entries.map(([, em]) => `<span class="reaction-chip">${escapeHtml(em)}</span>`).join("")}</div>`;
          }
        }

        row.innerHTML = `
          <div class="bubble" data-msg-id="${m.id}">
            ${replyHtml}
            ${contentHtml}
          </div>
          ${reactionsHtml}
          <div class="msg-meta">
            <span>${timeText}</span>
            ${ticksHtml}
            ${burnHtml}
          </div>
        `;

        // Long press / action menu on message
        const bubble = row.querySelector(".bubble");
        attachMessageActions(bubble, m, isMe);

        // Hydrate media from chunks
        if (m.mediaId) {
          hydrateMediaElement(row, m.mediaId, m.type);
        }

        listEl.appendChild(row);
      });
    }

    // ------------------ MEDIA CHUNKING & PLAYBACK ------------------
    const mediaCache = new Map();

    async function assembleMediaDataUrl(mediaId) {
      if (mediaCache.has(mediaId)) return mediaCache.get(mediaId);
      const q = query(
        collection(db, "chats", CHAT_ID, "media", mediaId, "chunks"),
        orderBy("chunkId", "asc")
      );
      const snap = await getDocs(q);
      if (snap.empty) return null;
      const fullDataUrl = snap.docs.map((d) => d.data().data || "").join("");
      mediaCache.set(mediaId, fullDataUrl);
      return fullDataUrl;
    }

    async function hydrateMediaElement(rowEl, mediaId, type) {
      const dataUrl = await assembleMediaDataUrl(mediaId);
      if (!dataUrl) return;

      if (type === "image") {
        const img = rowEl.querySelector(`img[data-media-id="${mediaId}"]`);
        if (img) {
          img.src = dataUrl;
          img.onclick = () => openFullscreenViewer(dataUrl, "image", "ছবি");
        }
      } else if (type === "audio") {
        const aud = rowEl.querySelector(`audio[data-media-id="${mediaId}"]`);
        if (aud) {
          aud.src = dataUrl;
        }
      } else if (type === "video") {
        const vid = rowEl.querySelector(`video[data-media-id="${mediaId}"]`);
        if (vid) {
          vid.src = dataUrl;
        }
        const openBtn = rowEl.querySelector(`[data-open-media-id="${mediaId}"]`);
        if (openBtn) {
          openBtn.onclick = () => openFullscreenViewer(dataUrl, "video", "ভিডিও");
        }
      }
    }

    function openFullscreenViewer(dataUrl, type, title) {
      $("viewerTitle").textContent = title;
      if (type === "video") {
        $("viewerContent").innerHTML = `<video src="${dataUrl}" controls autoplay playsinline style="max-width:100%;max-height:85dvh;border-radius:12px;"></video>`;
      } else {
        $("viewerContent").innerHTML = `<img src="${dataUrl}" alt="${escapeHtml(title)}" style="max-width:100%;max-height:85dvh;border-radius:12px;" />`;
      }
      $("viewerOverlay").classList.add("open");
    }

    $("closeViewerBtn").addEventListener("click", () => {
      $("viewerContent").innerHTML = "";
      $("viewerOverlay").classList.remove("open");
    });

    async function uploadDataUrlAsMedia(dataUrl, msgType) {
      if (!currentUser) return;
      const mediaId = "med_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
      const totalChunks = Math.ceil(dataUrl.length / CHUNK_SIZE);

      await setDoc(doc(db, "chats", CHAT_ID, "media", mediaId), {
        ownerId: currentUser.uid,
        total: totalChunks,
        createdAt: serverTimestamp()
      });

      for (let i = 0; i < totalChunks; i++) {
        const part = dataUrl.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
        const chunkKey = String(i).padStart(4, "0");
        await setDoc(doc(db, "chats", CHAT_ID, "media", mediaId, "chunks", chunkKey), {
          chunkId: i,
          data: part,
          ownerId: currentUser.uid,
          total: totalChunks,
          createdAt: serverTimestamp()
        });
      }

      await setDoc(doc(collection(db, "chats", CHAT_ID, "messages")), {
        type: msgType,
        mediaId,
        senderId: currentUser.uid,
        createdAt: serverTimestamp(),
        status: "sent",
        reactions: {},
        hiddenFor: []
      });
    }

    // Auto-compress image
    $("pickImageBtn").addEventListener("click", () => $("imageFileInput").click());
    $("imageFileInput").addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = async () => {
          const maxDim = 960;
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          const compressed = canvas.toDataURL("image/jpeg", 0.72);
          showToast("ছবি পাঠানো হচ্ছে...");
          await uploadDataUrlAsMedia(compressed, "image");
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    });

    // Voice note recorder (max 2 minutes)
    $("recordAudioBtn").addEventListener("click", async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (ev) => {
          if (ev.data.size > 0) recordChunks.push(ev.data);
        };
        mediaRecorder.onstop = async () => {
          clearTimeout(recordTimer);
          stream.getTracks().forEach((t) => t.stop());
          $("recordAudioBtn").textContent = "🎙️";
          const blob = new Blob(recordChunks, { type: mediaRecorder.mimeType || "audio/webm" });
          const reader = new FileReader();
          reader.onload = async () => {
            showToast("ভয়েস নোট পাঠানো হচ্ছে...");
            await uploadDataUrlAsMedia(reader.result, "audio");
          };
          reader.readAsDataURL(blob);
        };
        mediaRecorder.start();
        $("recordAudioBtn").textContent = "⏹️";
        showToast("ভয়েস রেকর্ড চলছে (সর্বোচ্চ ২ মিনিট)...");
        recordTimer = setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
        }, MAX_AUDIO_SECONDS * 1000);
      } catch {
        showToast("মাইক্রোফোন অনুমতি প্রয়োজন");
      }
    });

    // Camera-only video recorder (max 15 seconds)
    $("recordVideoBtn").addEventListener("click", async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }
      try {
        if (navigator.mediaDevices?.getUserMedia && window.MediaRecorder) {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: true
          });
          $("localVideo").srcObject = stream;
          $("callOverlay").classList.add("active");
          $("callPeerLabel").textContent = "ভিডিও রেকর্ড (সর্বোচ্চ ১৫ সেকেন্ড)";
          $("callStatusLabel").textContent = "রেকর্ড হচ্ছে...";

          recordChunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = (ev) => {
            if (ev.data.size > 0) recordChunks.push(ev.data);
          };
          mediaRecorder.onstop = async () => {
            clearTimeout(recordTimer);
            stream.getTracks().forEach((t) => t.stop());
            $("callOverlay").classList.remove("active");
            $("recordVideoBtn").textContent = "🎬";
            const blob = new Blob(recordChunks, { type: mediaRecorder.mimeType || "video/webm" });
            const reader = new FileReader();
            reader.onload = async () => {
              showToast("ভিডিও পাঠানো হচ্ছে...");
              await uploadDataUrlAsMedia(reader.result, "video");
            };
            reader.readAsDataURL(blob);
          };
          mediaRecorder.start();
          $("recordVideoBtn").textContent = "⏹️";
          recordTimer = setTimeout(() => {
            if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
          }, MAX_VIDEO_SECONDS * 1000);
        } else {
          $("videoFileInput").click();
        }
      } catch {
        $("videoFileInput").click();
      }
    });

    $("videoFileInput").addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        showToast("ভিডিও পাঠানো হচ্ছে...");
        await uploadDataUrlAsMedia(reader.result, "video");
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    });

    // ------------------ WEBRTC VOICE / VIDEO CALL ------------------
    async function startCall(callType) {
      if (!currentUser) return;
      isCaller = true;
      callStartTime = Date.now();
      const callRef = doc(collection(db, "chats", CHAT_ID, "calls"));
      currentCallId = callRef.id;

      $("callOverlay").classList.remove("minimized");
      $("callOverlay").classList.add("active");
      $("incomingCallBar").style.display = "none";
      $("callPeerLabel").textContent = callType === "video" ? "ভিডিও কল" : "ভয়েস কল";
      $("callStatusLabel").textContent = "রিং হচ্ছে...";

      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: callType === "video"
      });
      $("localVideo").srcObject = localStream;

      peerConnection = new RTCPeerConnection({ iceServers });
      localStream.getTracks().forEach((t) => peerConnection.addTrack(t, localStream));

      peerConnection.ontrack = (ev) => {
        if (ev.streams?.[0]) $("remoteVideo").srcObject = ev.streams[0];
      };

      peerConnection.onicecandidate = async (ev) => {
        if (ev.candidate) {
          await setDoc(doc(collection(callRef, "candidates")), {
            from: currentUser.uid,
            candidate: ev.candidate.toJSON()
          });
        }
      };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      await setDoc(callRef, {
        from: currentUser.uid,
        type: callType,
        status: "ringing",
        offer: { type: offer.type, sdp: offer.sdp },
        createdAt: serverTimestamp()
      });

      listenToCallRoom(callRef.id, callType);
    }

    function subscribeIncomingCalls() {
      const callsCol = collection(db, "chats", CHAT_ID, "calls");
      onSnapshot(callsCol, (snap) => {
        snap.docChanges().forEach((ch) => {
          if (ch.type === "added") {
            const d = ch.doc.data();
            if (d.status === "ringing" && d.from !== currentUser?.uid && !currentCallId) {
              currentCallId = ch.doc.id;
              isCaller = false;
              $("callOverlay").classList.remove("minimized");
              $("callOverlay").classList.add("active");
              $("incomingCallBar").style.display = "flex";
              $("callPeerLabel").textContent = d.type === "video" ? "ইনকামিং ভিডিও কল" : "ইনকামিং ভয়েস কল";
              $("callStatusLabel").textContent = "কল আসছে...";
            }
          }
        });
      });
    }

    $("acceptCallBtn").addEventListener("click", async () => {
      if (!currentCallId) return;
      $("incomingCallBar").style.display = "none";
      const callRef = doc(db, "chats", CHAT_ID, "calls", currentCallId);
      const snap = await getDoc(callRef);
      if (!snap.exists()) return;
      const data = snap.data();
      callStartTime = Date.now();

      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: data.type === "video"
      });
      $("localVideo").srcObject = localStream;

      peerConnection = new RTCPeerConnection({ iceServers });
      localStream.getTracks().forEach((t) => peerConnection.addTrack(t, localStream));
      peerConnection.ontrack = (ev) => {
        if (ev.streams?.[0]) $("remoteVideo").srcObject = ev.streams[0];
      };
      peerConnection.onicecandidate = async (ev) => {
        if (ev.candidate) {
          await setDoc(doc(collection(callRef, "candidates")), {
            from: currentUser.uid,
            candidate: ev.candidate.toJSON()
          });
        }
      };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      await updateDoc(callRef, {
        status: "connected",
        answer: { type: answer.type, sdp: answer.sdp }
      });
      $("callStatusLabel").textContent = "সংযুক্ত";
      listenToCallRoom(currentCallId, data.type);
    });

    $("rejectCallBtn").addEventListener("click", async () => {
      if (currentCallId) {
        await updateDoc(doc(db, "chats", CHAT_ID, "calls", currentCallId), { status: "ended" }).catch(() => {});
      }
      cleanupCallUI("বাতিল", "কল বাতিল");
    });

    function listenToCallRoom(callId, callType) {
      const callRef = doc(db, "chats", CHAT_ID, "calls", callId);
      if (currentCallDocUnsub) currentCallDocUnsub();
      if (currentCallCandUnsub) currentCallCandUnsub();

      currentCallDocUnsub = onSnapshot(callRef, async (snap) => {
        if (!snap.exists()) return;
        const d = snap.data();
        if (d.answer && peerConnection && !peerConnection.currentRemoteDescription) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(d.answer));
          $("callStatusLabel").textContent = "সংযুক্ত";
        }
        if (d.status === "ended") {
          cleanupCallUI("শেষ হয়েছে", callType === "video" ? "ভিডিও কল" : "ভয়েস কল");
        }
      });

      currentCallCandUnsub = onSnapshot(collection(callRef, "candidates"), (snap) => {
        snap.docChanges().forEach(async (ch) => {
          if (ch.type === "added") {
            const c = ch.doc.data();
            if (c.from !== currentUser?.uid && peerConnection && c.candidate) {
              await peerConnection.addIceCandidate(new RTCIceCandidate(c.candidate)).catch(() => {});
            }
          }
        });
      });
    }

    async function cleanupCallUI(resultLabel, callTypeLabel) {
      if (currentCallDocUnsub) currentCallDocUnsub();
      if (currentCallCandUnsub) currentCallCandUnsub();
      currentCallDocUnsub = null;
      currentCallCandUnsub = null;

      if (localStream) {
        localStream.getTracks().forEach((t) => t.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      $("localVideo").srcObject = null;
      $("remoteVideo").srcObject = null;
      $("callOverlay").classList.remove("active");
      $("callOverlay").classList.remove("minimized");
      $("incomingCallBar").style.display = "none";

      if (currentCallId && isCaller && currentUser) {
        const durSec = callStartTime ? Math.max(1, Math.round((Date.now() - callStartTime) / 1000)) : 0;
        const durStr = `${Math.floor(durSec / 60)}m ${durSec % 60}s`;
        await setDoc(doc(collection(db, "chats", CHAT_ID, "messages")), {
          type: "call",
          callType: callTypeLabel,
          result: resultLabel,
          duration: durStr,
          senderId: currentUser.uid,
          createdAt: serverTimestamp(),
          status: "sent",
          reactions: {},
          hiddenFor: []
        }).catch(() => {});
      }

      currentCallId = null;
      callStartTime = null;
      isCaller = false;
    }

    $("voiceCallBtn").addEventListener("click", () => startCall("audio"));
    $("videoCallBtn").addEventListener("click", () => startCall("video"));

    $("toggleMuteBtn").addEventListener("click", () => {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        showToast(track.enabled ? "মাইক্রোফোন চালু" : "মিউট করা হয়েছে");
      }
    });

    $("toggleCamBtn").addEventListener("click", () => {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        showToast(track.enabled ? "ক্যামেরা চালু" : "ক্যামেরা বন্ধ");
      }
    });

    $("hangupCallBtn").addEventListener("click", async () => {
      if (currentCallId) {
        await updateDoc(doc(db, "chats", CHAT_ID, "calls", currentCallId), { status: "ended" }).catch(() => {});
      }
      cleanupCallUI("শেষ হয়েছে", "কল");
    });

    $("minimizeCallBtn").addEventListener("click", () => {
      $("callOverlay").classList.toggle("minimized");
    });

    // ------------------ BACKGROUND LOCK & BACK HANDLING ------------------
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        localStorage.setItem(LS_BG_AT, String(Date.now()));
        if (currentUser) {
          setDoc(doc(db, "users", currentUser.uid), {
            online: false,
            lastActive: serverTimestamp()
          }, { merge: true }).catch(() => {});
        }
      } else {
        const bgAt = Number(localStorage.getItem(LS_BG_AT) || "0");
        if (bgAt && Date.now() - bgAt > BACKGROUND_LOCK_MS && $("chatScreen").classList.contains("active")) {
          sessionStorage.removeItem(LS_PIN_UNLOCKED);
          startPinFlow("verify");
          showScreen("pinScreen");
        }
        if (currentUser && $("chatScreen").classList.contains("active")) {
          setDoc(doc(db, "users", currentUser.uid), {
            online: true,
            lastActive: serverTimestamp()
          }, { merge: true }).catch(() => {});
        }
      }
    });

    window.addEventListener("popstate", () => {
      if ($("viewerOverlay").classList.contains("open")) {
        $("viewerOverlay").classList.remove("open");
        return;
      }
      if ($("callOverlay").classList.contains("active") && !$("callOverlay").classList.contains("minimized")) {
        $("callOverlay").classList.add("minimized");
      }
    });

    onAuthStateChanged(auth, (user) => {
      currentUser = user || null;
    });

    // Initial load of saved active note
    (function init() {
      if (activeNoteId) {
        const found = getNotes().find((n) => n.id === activeNoteId);
        if (found) {
          $("noteTitleInput").value = found.title;
          $("noteBodyInput").value = found.body;
        }
      }
      applyLanguage();
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
    })();
  </script>
</body>
</html>
