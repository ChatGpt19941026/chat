<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#075E54">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Chat Gpt 2.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none;
  font-family:system-ui,-apple-system,"Noto Sans Bengali",Roboto,sans-serif;background:#ECE5DD;color:#111}
.screen{display:none;height:100dvh;flex-direction:column}
.screen.active{display:flex}
button{font:inherit;cursor:pointer}

/* লগইন */
#login,#pin{align-items:center;justify-content:center;padding:24px;background:#fff}
.card{width:100%;max-width:360px;text-align:center}
.logo{font-size:56px}
h1{margin:8px 0 24px;font-size:24px;color:#075E54}
input.f{width:100%;padding:14px;margin-bottom:12px;border:1px solid #ccc;border-radius:10px;font-size:16px}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#075E54;color:#fff;font-size:16px}
.btn:disabled{opacity:.6}
.err{color:#c62828;min-height:20px;margin:6px 0 12px;font-size:14px}
.link{background:none;border:0;color:#075E54;margin-top:18px;font-size:14px;text-decoration:underline}

/* PIN */
#pinMsg{font-size:18px;margin:12px 0 20px}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:24px}
.dot{width:16px;height:16px;border-radius:50%;background:#ddd}
.dot.on{background:#075E54}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}
.pad button{height:76px;border-radius:50%;border:0;background:#f1f1f1;font-size:28px}
.pad button:active{background:#ddd}
.pad .ghost{background:none;pointer-events:none}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* চ্যাট */
header{display:flex;align-items:center;gap:4px;padding:10px 10px;padding-top:calc(10px + env(safe-area-inset-top));
  background:#075E54;color:#fff}
header .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px;font-weight:600;padding-left:4px}
header button{background:none;border:0;color:#fff;font-size:19px;padding:6px 5px}
#adBar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#0b6f63;color:#fff;font-size:13px}
#adBar span{flex:1}
#adBar small{opacity:.7;font-size:11px}
#adBar button{border:0;border-radius:14px;padding:5px 12px;background:#fff;color:#075E54;font-size:13px;font-weight:600}
#list{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column}
.day{align-self:center;margin:10px 0;padding:4px 12px;border-radius:8px;background:#e1f2fb;font-size:12px;color:#555}
.row{display:flex;padding:2px 8px}
.row.me{justify-content:flex-end}
.b{max-width:80%;padding:6px 10px 4px;border-radius:12px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.12);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.me .b{background:#DCF8C6;border-bottom-right-radius:2px}
.row:not(.me) .b{border-bottom-left-radius:2px}
.tx{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.35}
.meta{display:flex;justify-content:flex-end;gap:4px;margin-top:2px;font-size:11px;color:#667}
.tick.seen{color:#34B7F1}
.cd{color:#c62828;font-weight:600}
.empty{margin:auto;color:#777;font-size:14px}
.bar{display:flex;align-items:flex-end;gap:8px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:#ECE5DD}
.bar textarea{flex:1;max-height:120px;padding:11px 16px;border:0;border-radius:22px;font:inherit;font-size:16px;resize:none;outline:none;background:#fff}
.send{width:46px;height:46px;border:0;border-radius:50%;background:#075E54;color:#fff;font-size:20px;flex:none}

/* ডায়ালগ ও টোস্ট */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
#modal.show{display:flex}
.dlg{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:320px}
.dlg p{margin:0 0 16px;font-size:16px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.dlg button{padding:10px 16px;border:0;border-radius:8px;background:#eee;font-size:15px}
.dlg button.danger{background:#c62828;color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;
  border-radius:20px;font-size:14px;display:none;z-index:60;max-width:90%;text-align:center}

/* কল */
#call{position:fixed;inset:0;z-index:30;background:#101820;display:none;flex-direction:column;align-items:center;color:#fff}
#call.show{display:flex}
#remoteV{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#101820}
#localV{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));width:96px;height:128px;object-fit:cover;
  border-radius:12px;background:#000;transform:scaleX(-1);z-index:3;display:none;border:2px solid rgba(255,255,255,.5)}
#call.vid #localV{display:block}
.callTop{position:relative;z-index:3;margin-top:calc(40px + env(safe-area-inset-top));text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.callTop .nm{font-size:24px;font-weight:600}
#callStatus{margin-top:6px;font-size:16px;opacity:.9;min-height:22px}
.voiceAv{position:relative;z-index:2;margin:auto;font-size:96px}
#call.vid .voiceAv{display:none}
.ctrls{position:relative;z-index:3;display:flex;gap:22px;margin-top:auto;margin-bottom:calc(36px + env(safe-area-inset-bottom))}
.cb{width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:26px}
.cb.off{background:#fff;color:#000}
.cb.end{background:#e53935}
.cb.ok{background:#25D366}
#call:not(.vid) #camBtn{display:none}
#incoming{position:fixed;inset:0;z-index:40;background:#075E54;color:#fff;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
#incoming.show{display:flex}
#incoming .big{font-size:72px}
#incoming .nm{font-size:26px;font-weight:600}
.inActs{display:flex;gap:56px;margin-top:40px}
</style>
</head>
<body>

<!-- লগইন -->
<section id="login" class="screen">
  <form class="card" id="loginForm">
    <div class="logo">💬</div>
    <h1>Chat Gpt 2.0</h1>
    <input class="f" id="email" type="email" placeholder="ইমেইল" autocomplete="username" required>
    <input class="f" id="password" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn" type="submit">লগইন</button>
  </form>
</section>

<!-- PIN -->
<section id="pin" class="screen">
  <div class="card">
    <div class="logo">🔒</div>
    <div id="pinMsg"></div>
    <div class="dots" id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="pad" id="pad"></div>
    <button class="link" id="forgot">PIN ভুলে গেছেন? লগআউট করুন</button>
  </div>
</section>

<!-- চ্যাট -->
<section id="chat" class="screen">
  <header>
    <div class="t">Chat Gpt 2.0</div>
    <button id="callV" title="ভয়েস কল">📞</button>
    <button id="callVid" title="ভিডিও কল">🎥</button>
    <button id="clearBtn" title="সব মুছুন" style="margin-right:14px">🗑️</button>
    <button id="lockBtn" title="লক">🔒</button>
    <button id="logoutBtn" title="লগআউট">⎋</button>
  </header>
  <div id="adBar"><span id="adText"></span><small id="ver">v4</small><button id="adBtn" type="button"></button></div>
  <div id="list"></div>
  <div class="bar">
    <textarea id="msg" rows="1" placeholder="মেসেজ লিখুন"></textarea>
    <button class="send" id="sendBtn" aria-label="পাঠান">➤</button>
  </div>
</section>

<!-- কল স্ক্রিন -->
<div id="call">
  <video id="remoteV" autoplay playsinline></video>
  <video id="localV" autoplay playsinline muted></video>
  <div class="callTop"><div class="nm">Chat Gpt 2.0</div><div id="callStatus"></div></div>
  <div class="voiceAv">❤️</div>
  <div class="ctrls">
    <button class="cb" id="muteBtn" aria-label="মাইক">🎤</button>
    <button class="cb" id="camBtn" aria-label="ক্যামেরা">📷</button>
    <button class="cb end" id="hangBtn" aria-label="কল কাটুন">📵</button>
  </div>
</div>

<!-- ইনকামিং কল -->
<div id="incoming">
  <div class="big">📞</div>
  <div class="nm">Chat Gpt 2.0</div>
  <div id="incType"></div>
  <div class="inActs">
    <button class="cb end" id="declineBtn" aria-label="কেটে দিন">📵</button>
    <button class="cb ok" id="acceptBtn" aria-label="ধরুন">📞</button>
  </div>
</div>

<div id="modal"><div class="dlg"><p id="modalText"></p><div class="acts">
  <button id="modalNo">না</button><button class="danger" id="modalYes">হ্যাঁ</button></div></div></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limitToLast, onSnapshot,
  addDoc, updateDoc, deleteDoc, doc, serverTimestamp, getDocs, getDoc, setDoc, writeBatch, limit, where }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCfUSphJqDJ5Ijs0Tp2foYcpkpyIHHNseA",
  authDomain: "chatting-app-ec589.firebaseapp.com",
  projectId: "chatting-app-ec589",
  storageBucket: "chatting-app-ec589.firebasestorage.app",
  messagingSenderId: "1040131212910",
  appId: "1:1040131212910:web:26949df7ca0234fdb4087f"
};
const ALLOWED = ["sumonlovemandira@gmail.com", "mandiralovesumon@gmail.com"];
const CHAT_ID = "couple_chat";
const RELOCK_MS = 30000;          // এতক্ষণের বেশি ব্যাকগ্রাউন্ডে থাকলে আবার লক
const AUTO_DELETE_MS = 30000;     // সিন হওয়ার কতক্ষণ পর মেসেজ মুছবে (৩০ সেকেন্ড)
const PIN_KEY = "cc_pin_hash", LOCK_KEY = "cc_lock_until";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let me = null, unlocked = false, unsub = null, lastDocs = [], hiddenAt = 0;

/* ---------- ছোট সহায়ক ---------- */
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}
let toastTimer;
function toast(t) {
  const el = $("toast"); el.textContent = t; el.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = "none", 3800);
}
// একই এরর বারবার দেখাবে না (১০ সেকেন্ডে একবার)
let lastErrAt = 0;
function errOnce(prefix, e) {
  const now = Date.now();
  if (now - lastErrAt < 10000) return;
  lastErrAt = now;
  const code = e && e.code ? e.code : String(e);
  toast(prefix + ": " + code + (code.includes("permission-denied") ? " — Firebase Rules Publish করুন" : ""));
}
let modalOpen = false;
function confirmBox(text, yesLabel = "হ্যাঁ") {
  return new Promise(res => {
    modalOpen = true;
    $("modalText").textContent = text; $("modalYes").textContent = yesLabel;
    $("modal").classList.add("show");
    const done = v => { $("modal").classList.remove("show"); modalOpen = false;
      $("modalYes").onclick = $("modalNo").onclick = null; res(v); };
    $("modalYes").onclick = () => done(true);
    $("modalNo").onclick = () => done(false);
  });
}

/* ---------- লগইন ---------- */
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("email").value.trim().toLowerCase();
  $("loginErr").textContent = "";
  if (!ALLOWED.includes(email)) { $("loginErr").textContent = "এই ইমেইল অনুমোদিত নয়"; return; }
  $("loginBtn").disabled = true;
  try {
    await signInWithEmailAndPassword(auth, email, $("password").value);
  } catch (err) {
    const m = {
      "auth/invalid-credential": "ইমেইল বা পাসওয়ার্ড ভুল",
      "auth/wrong-password": "পাসওয়ার্ড ভুল",
      "auth/network-request-failed": "ইন্টারনেট সংযোগ নেই",
      "auth/too-many-requests": "অনেকবার ভুল হয়েছে, একটু পরে চেষ্টা করুন",
      "auth/unauthorized-domain": "এই ওয়েবসাইট Firebase-এর Authorized domains-এ যোগ করা হয়নি"
    };
    $("loginErr").textContent = m[err.code] || ("লগইন ব্যর্থ: " + err.code);
  }
  $("loginBtn").disabled = false;
});

onAuthStateChanged(auth, user => {
  if (!user) { me = null; unlocked = false; stopChat(); stopCalls(); show("login"); return; }
  if (!ALLOWED.includes((user.email || "").toLowerCase())) { signOut(auth); return; }
  me = user;
  startRingListener();
  if (unlocked) enterChat(); else startPin();
});

async function doLogout() {
  localStorage.removeItem(PIN_KEY);
  unlocked = false;
  await signOut(auth);
}
$("logoutBtn").onclick = async () => {
  if (await confirmBox("লগআউট করবেন? এই ফোনের PIN-ও মুছে যাবে।", "লগআউট")) doLogout();
};
$("forgot").onclick = async () => {
  if (await confirmBox("লগআউট করলে PIN মুছে যাবে। আবার ইমেইল-পাসওয়ার্ড দিয়ে ঢুকে নতুন PIN দিতে হবে।", "লগআউট")) doLogout();
};

/* ---------- PIN লক ---------- */
let pinBuf = "", pinFirst = null, pinMode = "unlock", fails = 0;

async function hashPin(p) {
  const data = new TextEncoder().encode("couple_chat_v1:" + me.uid + ":" + p);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function buildPad() {
  const pad = $("pad"); pad.innerHTML = "";
  const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  keys.forEach(k => {
    const b = document.createElement("button");
    b.type = "button";
    if (k === "") b.className = "ghost"; else b.textContent = k;
    if (k !== "") b.onclick = () => pressKey(k);
    pad.appendChild(b);
  });
}
function renderDots() {
  [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i < pinBuf.length));
}
function startPin() {
  pinBuf = ""; pinFirst = null; renderDots();
  const has = !!localStorage.getItem(PIN_KEY);
  pinMode = has ? "unlock" : "setup";
  $("pinMsg").textContent = has ? "PIN দিন" : "নতুন ৪ সংখ্যার PIN দিন";
  $("forgot").style.display = "";
  show("pin");
}
async function pressKey(k) {
  const until = Number(localStorage.getItem(LOCK_KEY) || 0);
  if (Date.now() < until) {
    $("pinMsg").textContent = "অপেক্ষা করুন " + Math.ceil((until - Date.now()) / 1000) + " সেকেন্ড"; return;
  }
  if (k === "⌫") { pinBuf = pinBuf.slice(0, -1); renderDots(); return; }
  if (pinBuf.length >= 4) return;
  pinBuf += k; renderDots();
  if (pinBuf.length < 4) return;

  const entered = pinBuf;
  if (pinMode === "setup") {
    if (pinFirst === null) {
      pinFirst = entered; pinBuf = ""; setTimeout(renderDots, 120);
      $("pinMsg").textContent = "আবার একই PIN দিন";
    } else if (pinFirst === entered) {
      localStorage.setItem(PIN_KEY, await hashPin(entered));
      unlock();
    } else {
      pinFirst = null; pinBuf = ""; setTimeout(renderDots, 120);
      $("pinMsg").textContent = "মেলেনি, নতুন করে PIN দিন"; shake();
    }
  } else {
    if ((await hashPin(entered)) === localStorage.getItem(PIN_KEY)) {
      fails = 0; unlock();
    } else {
      fails++; pinBuf = ""; setTimeout(renderDots, 120); shake();
      if (fails >= 5) {
        localStorage.setItem(LOCK_KEY, String(Date.now() + 30000)); fails = 0;
        $("pinMsg").textContent = "৫ বার ভুল, ৩০ সেকেন্ড অপেক্ষা করুন";
      } else $("pinMsg").textContent = "ভুল PIN, আবার চেষ্টা করুন";
    }
  }
}
function shake() { const d = $("dots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); }
function unlock() { unlocked = true; pinBuf = ""; enterChat(); renderIncoming(); }
function lockNow() { if (!me) return; unlocked = false; startPin(); renderIncoming(); }
$("lockBtn").onclick = lockNow;
buildPad();

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { hiddenAt = Date.now(); }
  else {
    if (me && unlocked && !call && hiddenAt && Date.now() - hiddenAt > RELOCK_MS) lockNow();
    hiddenAt = 0; markIncoming(); sweep();
  }
});

/* ---------- চ্যাট ---------- */
const col = () => collection(db, "chats", CHAT_ID, "messages");

function enterChat() { show("chat"); startChat(); render(true); markIncoming(); }

function startChat() {
  if (unsub) return;
  const q = query(col(), orderBy("createdAt", "asc"), limitToLast(300));
  unsub = onSnapshot(q, snap => { lastDocs = snap.docs; render(false); markIncoming(); sweep(); },
    err => errOnce("মেসেজ লোড ব্যর্থ", err));
  startSettings();
}
function stopChat() {
  if (unsub) { unsub(); unsub = null; }
  stopSettings();
  lastDocs = []; $("list").innerHTML = "";
}

/* প্রাপক মেসেজ দেখলে "সিন" চিহ্ন ও সিন-এর সময় (seenAt) বসে — সবসময়, সেটিং যা-ই হোক */
function markIncoming() {
  if (!me) return;
  const visible = unlocked && document.visibilityState === "visible";
  lastDocs.forEach(d => {
    const m = d.data();
    if (m.senderId === me.uid) return;
    if (visible && m.status !== "seen") {
      updateDoc(d.ref, { status: "seen", seenAt: serverTimestamp() })
        .catch(e => errOnce("সিন আপডেট ব্যর্থ", e));
    } else if (!visible && m.status === "sent") {
      updateDoc(d.ref, { status: "delivered" }).catch(() => {});
    }
  });
}

/* ---------- স্বয়ংক্রিয় মোছা (সিন হওয়ার ৩০ সেকেন্ড পর) ---------- */
const settingsRef = () => doc(db, "chats", CHAT_ID, "meta", "settings");
let autoDelete = false, enabledAtMs = 0, settingsUnsub = null, sweepTimer = null;
const deleting = new Set();

function startSettings() {
  if (settingsUnsub) return;
  settingsUnsub = onSnapshot(settingsRef(), s => {
    const data = s.exists() ? s.data({ serverTimestamps: "estimate" }) : {};
    autoDelete = !!data.autoDelete;
    enabledAtMs = data.enabledAt ? data.enabledAt.toMillis() : (autoDelete ? Date.now() : 0);
    // পুরনো সেটিংয়ে চালুর সময় না থাকলে এখনই বসিয়ে দিই
    if (autoDelete && !data.enabledAt) {
      setDoc(settingsRef(), { enabledAt: serverTimestamp() }, { merge: true }).catch(() => {});
    }
    renderAd(); sweep();
  }, e => errOnce("সেটিংস পড়া যায়নি", e));
  if (!sweepTimer) sweepTimer = setInterval(sweep, 1000);
}
function stopSettings() {
  if (settingsUnsub) { settingsUnsub(); settingsUnsub = null; }
  clearInterval(sweepTimer); sweepTimer = null;
  autoDelete = false; enabledAtMs = 0;
}
function renderAd() {
  $("adText").textContent = autoDelete
    ? "⏱️ সিন হওয়ার ৩০ সেকেন্ড পর মেসেজ মুছে যাবে"
    : "⏱️ স্বয়ংক্রিয় মোছা বন্ধ আছে";
  $("adBtn").textContent = autoDelete ? "বন্ধ করুন" : "চালু করুন";
  if (me) render(false);
}
// চালু করার পর সিন হওয়া মেসেজই শুধু মুছবে; আগের মেসেজে হাত দেবে না
function eligible(m) { return autoDelete && m.seenAt && m.seenAt.toMillis() >= enabledAtMs; }
const leftSec = seenMs => Math.max(0, Math.ceil((seenMs + AUTO_DELETE_MS - Date.now()) / 1000));

function sweep() {
  if (!me || !autoDelete) return;
  const now = Date.now();
  lastDocs.forEach(d => {
    if (deleting.has(d.id)) return;
    const m = d.data({ serverTimestamps: "estimate" });
    if (eligible(m) && now - m.seenAt.toMillis() >= AUTO_DELETE_MS) {
      deleting.add(d.id);
      deleteDoc(d.ref)
        .then(() => deleting.delete(d.id))
        .catch(e => { errOnce("মোছা ব্যর্থ", e); setTimeout(() => deleting.delete(d.id), 15000); });
    }
  });
  document.querySelectorAll(".cd").forEach(el => {
    el.textContent = "⏱ " + leftSec(Number(el.dataset.seen)) + "s";
  });
}
$("adBtn").onclick = () => {
  const next = !autoDelete;
  const data = next ? { autoDelete: true, enabledAt: serverTimestamp() } : { autoDelete: false };
  setDoc(settingsRef(), data, { merge: true })
    .then(() => toast(next
      ? "চালু: এখন থেকে সিন হওয়া মেসেজ ৩০ সেকেন্ড পর মুছবে"
      : "স্বয়ংক্রিয় মোছা বন্ধ করা হয়েছে"))
    .catch(e => errOnce("সেটিং বদলানো যায়নি", e));
};

const fmtTime = d => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
function dayLabel(d) {
  const t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return "আজ";
  if (d.toDateString() === y.toDateString()) return "গতকাল";
  return d.toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" });
}

function render(forceBottom) {
  const list = $("list");
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 140;
  const frag = document.createDocumentFragment();
  let lastDay = "";
  if (!lastDocs.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = "এখনও কোনো মেসেজ নেই। প্রথম মেসেজটি পাঠান ❤️"; frag.appendChild(e);
  }
  lastDocs.forEach(d => {
    const m = d.data({ serverTimestamps: "estimate" });
    const when = m.createdAt ? m.createdAt.toDate() : new Date();
    const key = when.toDateString();
    if (key !== lastDay) {
      lastDay = key;
      const s = document.createElement("div"); s.className = "day"; s.textContent = dayLabel(when); frag.appendChild(s);
    }
    const mine = m.senderId === me.uid;
    const row = document.createElement("div"); row.className = "row" + (mine ? " me" : "");
    const b = document.createElement("div"); b.className = "b";
    const tx = document.createElement("div"); tx.className = "tx"; tx.textContent = m.text || "";
    const meta = document.createElement("div"); meta.className = "meta";
    if (eligible(m)) {
      const w = document.createElement("span");
      w.className = "cd"; w.dataset.seen = String(m.seenAt.toMillis());
      w.textContent = "⏱ " + leftSec(m.seenAt.toMillis()) + "s";
      meta.appendChild(w);
    }
    const time = document.createElement("span"); time.textContent = fmtTime(when); meta.appendChild(time);
    if (mine) {
      const t = document.createElement("span");
      const st = m.status || "sent";
      t.className = "tick" + (st === "seen" ? " seen" : "");
      t.textContent = st === "sent" ? "✓" : "✓✓";
      meta.appendChild(t);
      attachLongPress(b, d.id);
    }
    b.append(tx, meta); row.appendChild(b); frag.appendChild(row);
  });
  list.replaceChildren(frag);
  if (forceBottom || nearBottom) list.scrollTop = list.scrollHeight;
}

function attachLongPress(el, id) {
  let timer;
  el.addEventListener("touchstart", () => { timer = setTimeout(() => askDelete(id), 550); }, { passive: true });
  ["touchend", "touchmove", "touchcancel"].forEach(ev =>
    el.addEventListener(ev, () => clearTimeout(timer), { passive: true }));
  el.addEventListener("contextmenu", e => { e.preventDefault(); askDelete(id); });
}
async function askDelete(id) {
  if (modalOpen) return;
  if (await confirmBox("এই মেসেজ ডিলিট করবেন? দুজনের চ্যাট থেকেই মুছে যাবে।", "ডিলিট")) {
    deleteDoc(doc(db, "chats", CHAT_ID, "messages", id)).catch(e => errOnce("ডিলিট ব্যর্থ", e));
  }
}

/* ---------- সব মেসেজ মোছা (কনফার্মেশন ছাড়া) ---------- */
let clearing = false;
async function clearAll() {
  if (clearing || !me) return;
  clearing = true;
  try {
    while (true) {
      const snap = await getDocs(query(col(), limit(400)));
      if (snap.empty) break;
      const batch = writeBatch(db);
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    toast("সব মেসেজ মুছে গেছে");
  } catch (e) {
    errOnce("মোছা ব্যর্থ", e);
  }
  clearing = false;
}
$("clearBtn").onclick = clearAll;

/* ---------- মেসেজ পাঠানো ---------- */
const msg = $("msg");
function grow() { msg.style.height = "auto"; msg.style.height = Math.min(msg.scrollHeight, 120) + "px"; }
msg.addEventListener("input", grow);
function send() {
  const text = msg.value.trim();
  if (!text || !me) return;
  msg.value = ""; grow(); msg.focus();
  addDoc(col(), { type: "text", text, senderId: me.uid, createdAt: serverTimestamp(), status: "sent" })
    .catch(e => errOnce("পাঠানো ব্যর্থ", e));
  setTimeout(() => { $("list").scrollTop = $("list").scrollHeight; }, 50);
}
$("sendBtn").onclick = send;
$("sendBtn").addEventListener("mousedown", e => e.preventDefault()); // কীবোর্ড বন্ধ হবে না

/* কীবোর্ড খুললে ভিউপোর্ট ঠিক রাখা */
if (window.visualViewport) {
  visualViewport.addEventListener("resize", () => {
    $("chat").style.height = visualViewport.height + "px";
    $("list").scrollTop = $("list").scrollHeight;
  });
}

/* =====================================================
   ভয়েস / ভিডিও কল (WebRTC) — সংযোগের তথ্য Firestore দিয়ে আদান-প্রদান
   ===================================================== */
const callsCol = () => collection(db, "chats", CHAT_ID, "calls");
let call = null;        // চলমান কল
let incoming = null;    // আসা কল (রিং হচ্ছে)
let ringUnsub = null, busy = false;

// TURN/STUN তথ্য Firestore-এর config/ice ডকুমেন্ট থেকে আসে (কোডে গোপন তথ্য থাকে না)
async function getIceServers() {
  try {
    const s = await getDoc(doc(db, "config", "ice"));
    if (s.exists()) {
      const arr = JSON.parse(s.data().json);
      if (Array.isArray(arr) && arr.length) return arr;
    }
  } catch (e) {}
  return [{ urls: "stun:stun.l.google.com:19302" }];
}

function getMedia(type) {
  return navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true },
    video: type === "video" ? { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } : false
  });
}

/* রিং শব্দ ও কম্পন */
let ringTimer = null, actx = null;
function startRing() {
  if (ringTimer) return;
  const beep = () => {
    try {
      if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 440; g.gain.value = 0.15;
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.35);
    } catch (e) {}
  };
  beep(); ringTimer = setInterval(beep, 1800);
}
function stopRing() { clearInterval(ringTimer); ringTimer = null; }

/* আসা কলের শোনা */
function startRingListener() {
  if (ringUnsub) return;
  const q = query(callsCol(), where("status", "==", "ringing"));
  ringUnsub = onSnapshot(q, snap => {
    incoming = null;
    snap.docs.forEach(d => {
      const m = d.data({ serverTimestamps: "estimate" });
      const age = Date.now() - (m.createdAt ? m.createdAt.toMillis() : Date.now());
      if (m.from === me.uid) {
        // নিজের পুরনো আটকে থাকা কল পরিষ্কার
        if (age > 90000 && !(call && call.ref.id === d.id)) updateDoc(d.ref, { status: "ended" }).catch(() => {});
        return;
      }
      if (age < 90000 && !call) incoming = { ref: d.ref, id: d.id, type: m.type, offer: m.offer };
    });
    renderIncoming();
  }, () => {});
}
function stopCalls() {
  endCall(false);
  if (ringUnsub) { ringUnsub(); ringUnsub = null; }
  incoming = null; renderIncoming();
}
function renderIncoming() {
  const showIt = !!(incoming && unlocked && !call);
  $("incoming").classList.toggle("show", showIt);
  $("incType").textContent = incoming ? (incoming.type === "video" ? "ভিডিও কল আসছে…" : "ভয়েস কল আসছে…") : "";
  if (showIt) startRing(); else stopRing();
}

function setCallStatus(t) { $("callStatus").textContent = t; }
async function openCallUI(type, status) {
  $("call").classList.toggle("vid", type === "video");
  $("call").classList.add("show");
  $("muteBtn").classList.remove("off"); $("muteBtn").textContent = "🎤";
  $("camBtn").classList.remove("off"); $("camBtn").textContent = "📷";
  setCallStatus(status);
  if (type === "video" && call) {
    $("localV").srcObject = new MediaStream(call.stream.getVideoTracks());
    $("localV").play().catch(() => {});
  }
  try { if (navigator.wakeLock && call) call.wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}

async function applyRemote(c, desc) {
  await c.pc.setRemoteDescription(new RTCSessionDescription(desc));
  c.remoteSet = true;
  clearTimeout(c.ringTimeout);
  c.pending.splice(0).forEach(x => c.pc.addIceCandidate(new RTCIceCandidate(x)).catch(() => {}));
}

async function setupPeer(callRef, type, stream, role) {
  const pc = new RTCPeerConnection({ iceServers: await getIceServers() });
  const c = { ref: callRef, pc, stream, type, role, unsubs: [], pending: [],
              remoteSet: false, gotAnswer: false, docSeen: false,
              timer: null, ringTimeout: null, startedAt: 0, wake: null };
  call = c;
  stream.getTracks().forEach(t => pc.addTrack(t, stream));

  pc.ontrack = e => {
    $("remoteV").srcObject = e.streams[0];
    $("remoteV").play().catch(() => {});
  };
  pc.onicecandidate = e => {
    if (e.candidate) {
      addDoc(collection(callRef, "candidates"), { from: me.uid, c: e.candidate.toJSON() }).catch(() => {});
    }
  };
  pc.onconnectionstatechange = () => {
    if (call !== c) return;
    const s = pc.connectionState;
    if (s === "connected") { c.startedAt = Date.now(); startTimer(c); }
    else if (s === "disconnected") setCallStatus("সংযোগ দুর্বল…");
    else if (s === "failed") {
      toast("সংযোগ ব্যর্থ হয়েছে। মোবাইল ডাটায় হলে TURN সেটআপ লাগতে পারে।");
      endCall(true);
    }
  };

  // অন্যপক্ষের ICE candidate
  c.unsubs.push(onSnapshot(collection(callRef, "candidates"), snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type !== "added") return;
      const d = ch.doc.data();
      if (d.from === me.uid) return;
      if (c.remoteSet) pc.addIceCandidate(new RTCIceCandidate(d.c)).catch(() => {});
      else c.pending.push(d.c);
    });
  }));

  // কলের অবস্থা
  c.unsubs.push(onSnapshot(callRef, snap => {
    if (!snap.exists()) { if (c.docSeen) endCall(false); return; }
    c.docSeen = true;
    const m = snap.data();
    if (m.status === "declined") { toast("কল প্রত্যাখ্যান করা হয়েছে"); endCall(false); }
    else if (m.status === "ended" || m.status === "missed") { toast("কল শেষ হয়েছে"); endCall(false); }
    else if (c.role === "caller" && m.answer && !c.gotAnswer) {
      c.gotAnswer = true;
      setCallStatus("সংযোগ হচ্ছে…");
      applyRemote(c, m.answer).catch(() => {});
    }
  }));
  return c;
}

function startTimer(c) {
  clearInterval(c.timer);
  const tick = () => {
    const s = Math.floor((Date.now() - c.startedAt) / 1000);
    setCallStatus(String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"));
  };
  tick(); c.timer = setInterval(tick, 1000);
}

async function startCall(type) {
  if (call || busy || !me) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast("এই ব্রাউজারে কল সমর্থিত নয়"); return; }
  busy = true;
  let stream = null;
  try {
    try { stream = await getMedia(type); }
    catch (e) { toast("মাইক্রোফোন/ক্যামেরার অনুমতি দিন"); return; }
    const ref = doc(callsCol());
    const c = await setupPeer(ref, type, stream, "caller");
    openCallUI(type, "কল করা হচ্ছে…");
    const offer = await c.pc.createOffer();
    await c.pc.setLocalDescription(offer);
    await setDoc(ref, { from: me.uid, type, status: "ringing", createdAt: serverTimestamp(),
                        offer: { type: offer.type, sdp: offer.sdp } });
    c.ringTimeout = setTimeout(() => {
      if (call === c && !c.remoteSet) {
        toast("কেউ ধরেননি");
        updateDoc(ref, { status: "missed" }).catch(() => {});
        endCall(false);
      }
    }, 45000);
  } catch (e) {
    toast("কল শুরু করা যায়নি: " + (e.code || e.message));
    if (call) endCall(false); else if (stream) stream.getTracks().forEach(t => t.stop());
  } finally { busy = false; }
}

async function acceptCall() {
  if (!incoming || call || busy) return;
  const inc = incoming; incoming = null;
  busy = true;
  let stream = null;
  try {
    try { stream = await getMedia(inc.type); }
    catch (e) {
      toast("মাইক্রোফোন/ক্যামেরার অনুমতি দিন");
      updateDoc(inc.ref, { status: "declined" }).catch(() => {});
      renderIncoming(); return;
    }
    const c = await setupPeer(inc.ref, inc.type, stream, "callee");
    renderIncoming();
    openCallUI(inc.type, "সংযোগ হচ্ছে…");
    await applyRemote(c, inc.offer);
    const ans = await c.pc.createAnswer();
    await c.pc.setLocalDescription(ans);
    await updateDoc(inc.ref, { answer: { type: ans.type, sdp: ans.sdp }, status: "active" });
  } catch (e) {
    toast("কল ধরা যায়নি: " + (e.code || e.message));
    if (call) endCall(true); else if (stream) stream.getTracks().forEach(t => t.stop());
  } finally { busy = false; }
}

function declineCall() {
  if (!incoming) return;
  const r = incoming.ref; incoming = null; renderIncoming();
  updateDoc(r, { status: "declined" }).catch(() => {});
  setTimeout(() => cleanupCall(r), 4000);
}

async function endCall(notify) {
  const c = call; if (!c) return;
  call = null;
  clearTimeout(c.ringTimeout); clearInterval(c.timer);
  c.unsubs.forEach(u => u());
  try { c.pc.close(); } catch (e) {}
  c.stream.getTracks().forEach(t => t.stop());
  if (c.wake) { try { c.wake.release(); } catch (e) {} }
  $("remoteV").srcObject = null; $("localV").srcObject = null;
  $("call").classList.remove("show");
  if (notify) updateDoc(c.ref, { status: "ended" }).catch(() => {});
  setTimeout(() => cleanupCall(c.ref), 4000);
  renderIncoming();
}

async function cleanupCall(ref) {
  try {
    const s = await getDocs(collection(ref, "candidates"));
    const b = writeBatch(db);
    s.forEach(d => b.delete(d.ref));
    b.delete(ref);
    await b.commit();
  } catch (e) {}
}

$("callV").onclick = () => startCall("voice");
$("callVid").onclick = () => startCall("video");
$("acceptBtn").onclick = acceptCall;
$("declineBtn").onclick = declineCall;
$("hangBtn").onclick = () => endCall(true);
$("muteBtn").onclick = () => {
  if (!call) return;
  const t = call.stream.getAudioTracks()[0]; if (!t) return;
  t.enabled = !t.enabled;
  $("muteBtn").classList.toggle("off", !t.enabled);
  $("muteBtn").textContent = t.enabled ? "🎤" : "🔇";
};
$("camBtn").onclick = () => {
  if (!call) return;
  const t = call.stream.getVideoTracks()[0]; if (!t) return;
  t.enabled = !t.enabled;
  $("camBtn").classList.toggle("off", !t.enabled);
  $("camBtn").textContent = t.enabled ? "📷" : "🚫";
};

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
