<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" id="themeMeta" content="#f59e0b">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png?v=11">
<link rel="apple-touch-icon" href="icon-192.png?v=11">
<title>My Notes</title>
<script>
try { document.documentElement.setAttribute("data-theme", localStorage.getItem("cc_theme") === "dark" ? "dark" : "light"); } catch (e) {}
</script>
<style>
:root{
  --bg:#ECE5DD;--txt:#111827;--hdr:#075E54;--hdr2:#064e46;--card:#ffffff;--me:#DCF8C6;--muted:#6b7280;
  --chip:#e6f2f8;--chipTxt:#374151;--accent:#075E54;--input:#ffffff;--line:#e5e7eb;--line2:#f3f4f6;
  --npBg:#fffdf8;--npHead:#d97706;--saveBg:#ffffff;--saveTxt:#92400e;--sheet:#ffffff;
  --soft:#f3f4f6;--soft2:#f1f5f9;--soft3:#cbd5e1;--qbg:rgba(0,0,0,.055);
  --replyBg:#efeae2;--replyBorder:#d6cfc4;--recBg:#fff7ed;--recBorder:#fdba74;
  --modalHead:#fef3c7;--modalHeadTxt:#78350f;--item:#ffffff;--itemBorder:#e5e7eb;--hover:#fef3c7;
  --dangerBg:#fee2e2;--dangerTxt:#b91c1c;--rpBg:rgba(0,0,0,.065);--sel:#dcfce7;--scr:#ffffff;
  --inBorder:#d1d5db;--dot:#d1d5db;--callTxt:#374151;--emptyTxt:#374151;--hlBg:#fef08a;--adBtnBg:#ffffff;--adBtnTxt:#075E54;
  --shadow:0 1px 2px rgba(15,23,42,.08);--popShadow:0 10px 28px rgba(15,23,42,.22);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b141a;--txt:#e9edef;--hdr:#1f2c34;--hdr2:#162026;--card:#202c33;--me:#005c4b;--muted:#8696a0;
  --chip:#182229;--chipTxt:#94a3b8;--accent:#00a884;--input:#2a3942;--line:#2f3b43;--line2:#26323a;
  --npBg:#111315;--npHead:#92400e;--saveBg:#fef3c7;--saveTxt:#78350f;--sheet:#1f2c34;
  --soft:#222c32;--soft2:#2a3942;--soft3:#374751;--qbg:rgba(255,255,255,.07);
  --replyBg:#1b262c;--replyBorder:#2f3b43;--recBg:#332410;--recBorder:#7c5a1a;
  --modalHead:#3b2a12;--modalHeadTxt:#fde68a;--item:#182026;--itemBorder:#2a363e;--hover:#26333c;
  --dangerBg:#451a1a;--dangerTxt:#fca5a5;--rpBg:rgba(255,255,255,.11);--sel:#0f3d33;--scr:#0b141a;
  --inBorder:#3a4850;--dot:#3a4850;--callTxt:#cbd5da;--emptyTxt:#cbd5e1;--hlBg:#3d4a2a;--adBtnBg:#2a3942;--adBtnTxt:#e9edef;
  --shadow:0 1px 2px rgba(0,0,0,.35);--popShadow:0 12px 32px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none;
  font-family:system-ui,-apple-system,"Noto Sans Bengali",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
.screen{display:none;height:100dvh;flex-direction:column}
.screen.active{display:flex}
button{font:inherit;cursor:pointer}
.ico{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:16px;height:16px}
.ico-lg{width:24px;height:24px}
.ico-xl{width:34px;height:34px}
.ico-2xl{width:54px;height:54px}
.num-tab{font-variant-numeric:tabular-nums}

/* নোটপ্যাড */
#notepad{background:var(--npBg);color:var(--txt)}
.npHead{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));
  background:var(--npHead);color:#fff;position:relative;box-shadow:var(--shadow)}
.npHead .npTitle{flex:1;font-size:18.5px;font-weight:700;letter-spacing:.1px;display:flex;align-items:center;gap:8px}
.npSaveBtn{border:0;border-radius:18px;padding:6px 15px;background:var(--saveBg);color:var(--saveTxt);
  font-size:13.5px;font-weight:700;box-shadow:var(--shadow);transition:transform .12s ease}
.npSaveBtn:active{transform:scale(.96)}
.npMenuBtn{border:0;background:none;color:#fff;width:36px;height:36px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center}
.npMenuBtn:active{background:rgba(255,255,255,.16)}
.npMenu{position:absolute;right:12px;top:calc(54px + env(safe-area-inset-top));background:var(--sheet);color:var(--txt);
  border-radius:14px;box-shadow:var(--popShadow);border:1px solid var(--itemBorder);min-width:215px;
  display:none;flex-direction:column;overflow:hidden;z-index:48}
.npMenu.show{display:flex}
.npMenu button{border:0;background:none;color:var(--txt);text-align:left;padding:12px 15px;font-size:14.5px;
  border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.npMenu button:last-child{border-bottom:0}
.npMenu button:active{background:var(--hover)}
.npBody{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#npSearchBox{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid transparent;
  border-radius:22px;padding:4px 12px;margin-bottom:12px;color:var(--muted)}
#npSearchBox:focus-within{border-color:var(--npHead);background:var(--input)}
#npSearch{flex:1;border:0;background:transparent;outline:none;font:inherit;font-size:15px;color:var(--txt);padding:6px 0;min-width:0}
#npSearchClear{display:none;border:0;background:none;color:var(--muted);padding:4px;border-radius:50%}
#npResults{display:none;flex:1;overflow-y:auto;flex-direction:column;gap:8px}
.npBody.searching #npResults{display:flex}
.npBody.searching #npEditor{display:none}
#npEditor{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--item);
  border:1px solid var(--itemBorder);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
#noteTitleInput{border:0;border-bottom:1px solid var(--line);padding:6px 2px 10px;font-size:18px;font-weight:700;
  background:transparent;outline:none;margin-bottom:10px;color:var(--txt)}
#noteBodyInput{flex:1;border:0;resize:none;font:inherit;font-size:16px;line-height:1.65;background:transparent;outline:none;color:var(--txt)}
.snip{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.npEmpty{text-align:center;color:var(--muted);padding:18px;font-size:14.5px}

/* নোটপ্যাড পপআপ */
#npOverlay{position:fixed;inset:0;background:rgba(15,23,42,.52);backdrop-filter:blur(2px);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:49}
#npOverlay.show{display:flex}
.npModal{background:var(--sheet);color:var(--txt);border-radius:16px;width:100%;max-width:380px;max-height:75dvh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--popShadow);border:1px solid var(--itemBorder)}
.npModalHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  background:var(--modalHead);font-weight:700;color:var(--modalHeadTxt)}
.npModalHead button{border:0;background:none;color:var(--modalHeadTxt);display:inline-flex;align-items:center;justify-content:center;padding:4px}
.npModalList{padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.savedItem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;
  border:1px solid var(--itemBorder);border-radius:12px;background:var(--item)}
.savedItem .siInfo{flex:1;min-width:0}
.savedItem .siInfo b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savedItem .siInfo small{color:var(--muted);font-size:12px}
.savedItem button{border:0;background:var(--dangerBg);color:var(--dangerTxt);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}
.langOpt{border:1px solid var(--itemBorder);background:var(--item);color:var(--txt);border-radius:10px;padding:12px;font-size:15px;text-align:left}
.langOpt.sel{border-color:var(--accent);font-weight:700}

/* লগইন ও PIN */
#login,#pin{align-items:center;justify-content:center;padding:24px;background:var(--scr);color:var(--txt);position:relative}
.backNoteBtn{position:absolute;left:14px;top:calc(14px + env(safe-area-inset-top));border:1px solid var(--line);
  background:var(--soft);color:var(--txt);border-radius:18px;padding:7px 13px;font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px}
.card{width:100%;max-width:360px;text-align:center}
.logo{width:76px;height:76px;margin:0 auto 12px;border-radius:22px;background:var(--soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
h1{margin:6px 0 22px;font-size:23px;font-weight:700;color:var(--accent)}
input.f{width:100%;padding:13px 14px;margin-bottom:12px;border:1px solid var(--inBorder);border-radius:12px;
  font-size:16px;background:var(--input);color:var(--txt);outline:none}
input.f:focus{border-color:var(--accent)}
.btn{width:100%;padding:13px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;box-shadow:var(--shadow)}
.btn:disabled{opacity:.6}
.err{color:#dc2626;min-height:20px;margin:6px 0 12px;font-size:14px}
.link{background:none;border:0;color:var(--muted);margin-top:14px;font-size:13.5px;text-decoration:underline;display:inline-block}
.bioBtn{margin-top:14px;padding:11px 18px;border-radius:22px;border:1px solid var(--accent);background:var(--soft);
  color:var(--accent);font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px}

#pinMsg{font-size:17px;font-weight:500;margin:10px 0 18px;min-height:26px}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:24px}
.dot{width:15px;height:15px;border-radius:50%;background:var(--dot);transition:transform .12s ease,background .12s ease}
.dot.on{background:var(--accent);transform:scale(1.12)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px;justify-content:center}
.pad button{height:74px;border-radius:50%;border:1px solid var(--line2);background:var(--soft2);color:var(--txt);
  font-size:26px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.pad button:active{background:var(--soft3);transform:scale(.96)}
.pad .ghost{background:none;border:0;box-shadow:none;pointer-events:none}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* সাধারণ পপআপ */
#pinModeModal,#setModal,#optModal{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;padding:24px}
#setModal{z-index:51}
#pinModeModal{z-index:52}
#optModal{z-index:53}
#pinModeModal.show,#setModal.show,#optModal.show{display:flex}
#pinModeModal .dlg,#setModal .dlg,#optModal .dlg{max-width:340px}
.pmTitle{margin:0 0 14px;font-size:18px;font-weight:700}
.pmHint{margin:0 0 10px;font-size:14px;color:var(--muted);line-height:1.45}
.pmOpt{display:block;width:100%;margin:0 0 10px;padding:12px 14px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:15.5px;font-weight:600}
.pmOpt:disabled{opacity:.5}
.pmGhost{display:block;width:100%;margin:0;padding:11px;border:0;border-radius:11px;background:var(--soft2);color:var(--txt);font-size:15px;font-weight:500}
.optBtn{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 8px;padding:12px 14px;border:1px solid var(--line);
  border-radius:11px;background:var(--soft2);color:var(--txt);font-size:15.5px;text-align:left}
.optBtn.sel{border-color:var(--accent);font-weight:700}
.pmInput{width:100%;padding:12px;border:1px solid var(--inBorder);border-radius:11px;font-size:16px;background:var(--input);color:var(--txt);margin-bottom:8px}
.pmInput:disabled{opacity:.5}
#pmNow{min-height:20px;font-size:14px;color:var(--accent);margin-bottom:4px}
.pmErr{min-height:18px;font-size:13px;color:#dc2626;margin-bottom:8px}

/* চ্যাট */
header{display:flex;align-items:center;gap:4px;padding:8px 8px;padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--hdr);color:#fff;box-shadow:var(--shadow)}
header .t{flex:1;min-width:0;padding-left:6px}
header .t .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#presence{display:flex;align-items:center;font-size:11.5px;opacity:.92;white-space:nowrap;overflow:hidden;margin-top:1px}
#presence.typing #pText{color:#9dffb8;font-style:italic;font-weight:600}
#pText{overflow:hidden;text-overflow:ellipsis}
.pd{flex:none;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-right:6px}
#presence.on .pd{background:#25D366;animation:glow 1.6s infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(37,211,102,.8)}70%{box-shadow:0 0 0 6px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
header button{background:none;border:0;color:#fff;width:36px;height:36px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;padding:0}
header button:active{background:rgba(255,255,255,.15)}
header #clearBtn{margin-right:2px}

#adBar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--hdr2);color:#fff;font-size:13px}
#adBar .ic{display:inline-flex;align-items:center;opacity:.92}
#adBar .spacer{flex:1}
#adBar small{opacity:.85;font-size:12px;text-decoration:underline;padding:2px 6px;cursor:pointer}
#adBar button{border:0;border-radius:14px;padding:4px 12px;background:var(--adBtnBg);color:var(--adBtnTxt);font-size:12.5px;font-weight:600}

#list{flex:1;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column}
.day{align-self:center;margin:10px 0;padding:4px 12px;border-radius:10px;background:var(--chip);font-size:12px;color:var(--chipTxt);box-shadow:var(--shadow)}
.older{align-self:center;margin:6px;padding:6px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);
  color:var(--accent);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.callLog{align-self:center;margin:6px 0;padding:6px 13px;border-radius:14px;background:var(--card);font-size:13px;color:var(--callTxt);
  box-shadow:var(--shadow);display:inline-flex;gap:8px;align-items:center}
.callLog small{color:var(--muted);font-size:11px}
.row{display:flex;padding:2.5px 10px}
.row.me{justify-content:flex-end}
.b{max-width:80%;padding:7px 11px 5px;border-radius:14px;background:var(--card);color:var(--txt);box-shadow:var(--shadow);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.me .b{background:var(--me);border-bottom-right-radius:4px}
.row:not(.me) .b{border-bottom-left-radius:4px}
.hl .b{animation:hl 1.4s}
@keyframes hl{0%,60%{background:var(--hlBg)}}
.q{border-left:3px solid var(--accent);background:var(--qbg);border-radius:8px;padding:4px 8px;margin-bottom:5px;
  font-size:13px;cursor:pointer;overflow:hidden}
.q b{display:block;color:var(--accent);font-size:12px}
.q span{display:block;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx{white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.4}
.mediaImg{display:block;width:240px;max-width:100%;max-height:280px;border-radius:10px;margin-bottom:4px;object-fit:contain;background:#000;cursor:pointer}
.mediaVid{display:block;width:240px;max-width:100%;max-height:260px;border-radius:10px;margin-bottom:4px;background:#000}
.mediaAud{display:block;width:240px;max-width:100%;height:36px;margin-bottom:4px}
.openMediaBtn{display:inline-flex;align-items:center;gap:5px;margin-bottom:4px;padding:4px 10px;border:0;border-radius:12px;
  background:var(--qbg);color:var(--accent);font-size:12px;font-weight:600}
.medPh{padding:16px 24px;font-size:13px;color:var(--muted)}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:2px;font-size:11px;color:var(--muted)}
.tick.seen{color:#34B7F1}
.cd{color:#dc2626;font-weight:600}
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rp{background:var(--rpBg);border-radius:10px;padding:1px 7px;font-size:13px}
.rp small{font-size:11px;margin-left:2px}
.empty{margin:auto;padding:18px;text-align:center;white-space:pre-line;color:var(--emptyTxt);font-size:24px;font-weight:600;line-height:1.5}

#replyBar{display:none;align-items:center;gap:8px;padding:7px 12px;background:var(--replyBg);border-top:1px solid var(--replyBorder)}
#replyBar.show{display:flex}
#replyBar .rbBody{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px;font-size:13px}
#replyBar b{display:block;color:var(--accent);font-size:12px}
#rbText{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
#rbClose{border:0;background:none;padding:6px;color:var(--txt);display:inline-flex;align-items:center;justify-content:center}

#recBar{display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--recBg);border-top:1px solid var(--recBorder);font-size:14px}
#recBar.show{display:flex}
#recTimer{font-weight:700;color:#dc2626;min-width:52px}
#recSend{border:0;border-radius:16px;padding:6px 14px;background:var(--accent);color:#fff;font-size:13px;font-weight:600}
#recCancel{border:0;border-radius:16px;padding:6px 14px;background:var(--soft3);color:var(--txt);font-size:13px;font-weight:500}

.bar{display:flex;align-items:flex-end;gap:6px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--bg)}
.ibtn{width:40px;height:40px;border:0;border-radius:50%;background:var(--card);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow)}
.ibtn:active{transform:scale(.95)}
.bar textarea{flex:1;max-height:120px;padding:10px 14px;border:0;border-radius:22px;font:inherit;font-size:15.5px;
  resize:none;outline:none;background:var(--input);color:var(--txt);box-shadow:var(--shadow)}
.send{width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow)}
.send:active{transform:scale(.95)}

/* মেসেজ মেনু ও ডিলিট মেনু */
#sheet,#delSheet{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:45}
#sheet.show,#delSheet.show{display:flex}
.sheetBox{width:100%;max-width:480px;background:var(--sheet);color:var(--txt);border-radius:18px 18px 0 0;
  padding:14px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:var(--popShadow)}
#rxRow{display:flex;justify-content:space-around;margin-bottom:10px}
#rxRow button{border:0;background:none;font-size:28px;padding:5px 7px;border-radius:50%}
#rxRow button.sel{background:var(--sel)}
.sheetBox>button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;
  color:var(--txt);padding:12px 10px;font-size:15.5px;border-radius:10px}
.sheetBox>button:active{background:var(--hover)}
.sheetBox>button.danger{color:#dc2626}

/* ফুল-স্ক্রিন মিডিয়া ভিউয়ার */
#mediaViewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:58;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#mediaViewer.show{display:flex}
#mvClose{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top));border:0;background:rgba(255,255,255,.18);
  color:#fff;border-radius:50%;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center}
#mvImg{max-width:100%;max-height:85vh;object-fit:contain;display:none}
#mvVid{max-width:100%;max-height:85vh;display:none}

/* ভিডিও রেকর্ডার */
#vidRecModal{position:fixed;inset:0;background:#090d10;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:24px;color:#fff}
#vidRecModal.show{display:flex}
#vidPreview{width:100%;max-width:420px;max-height:65vh;border-radius:16px;background:#111;transform:scaleX(-1);object-fit:cover}
.vrActs{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.vrActs button{border:0;border-radius:24px;padding:11px 18px;font-size:14.5px;font-weight:600}
#vrStart{background:#dc2626;color:#fff}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;

#callExit{position:absolute;left:60px;top:calc(12px + env(safe-area-inset-top));z-index:4;width:40px;height:40px;border:0;

.callTop{position:relative;z-index:3;margin-top:calc(44px + env(safe-area-inset-top));text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.65)}
.callTop .nm{font-size:23px;font-weight:700}
#callStatus{margin-top:6px;font-size:15.5px;opacity:.92;min-height:22px}
.voiceAv{position:relative;z-index:2;margin:auto;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.12);

function isDark() { return localStorage.getItem(THEME_KEY) === "dark"; }
function applyTheme() {
  const d = isDark();
  document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
  $("themeMeta").setAttribute("content", d ? "#92400e" : "#d97706");
  $("mTheme").innerHTML = `${svgHtml(d ? "sun" : "moon", "ico ico-sm")} ${npT(d ? "lightMode" : "darkMode")}`;
}
function setTheme(dark) {
  localStorage.setItem(THEME_KEY, dark ? "dark" : "light");
  applyTheme();
}
$("mTheme").onclick = () => { $("npMenu").classList.remove("show"); setTheme(!isDark()); };

  try {

const numLS = k => Number(localStorage.getItem(k) || 0);
const lockRemaining = () => Math.max(0, numLS(LOCK_UNTIL_KEY) - Date.now());
function registerWrong() {
  let level = numLS(LOCK_LEVEL_KEY), cnt = numLS(LOCK_CNT_KEY), mins = 0;
  if (level === 0) { cnt++; if (cnt >= 2) { mins = 10; level = 1; cnt = 0; } }
  else { mins = level === 1 ? 30 : 60; level = Math.min(level + 1, 3); }
  localStorage.setItem(LOCK_CNT_KEY, String(cnt));
  localStorage.setItem(LOCK_LEVEL_KEY, String(level));
  if (mins) localStorage.setItem(LOCK_UNTIL_KEY, String(Date.now() + mins * 60000));
  return mins;
}
function resetLock() { [LOCK_UNTIL_KEY, LOCK_LEVEL_KEY, LOCK_CNT_KEY].forEach(k => localStorage.removeItem(k)); }
const fmtMs = ms => { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

/* ---------- ফিঙ্গারপ্রিন্ট (WebAuthn) ---------- */
function bioSupported() {
  return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create && window.isSecureContext);
}
let bioBusy = false;
async function bioCheck() {
  const hexId = localStorage.getItem(BIO_KEY);
  if (!hexId || !bioSupported() || bioBusy) return false;
  bioBusy = true;
  try {
    const rawId = new Uint8Array(hexId.match(/.{1,2}/g).map(h => parseInt(h, 16)));
    const a = await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(16)),
        rpId: location.hostname,
        allowCredentials: [{ type: "public-key", id: rawId, transports: ["internal"] }],
        userVerification: "required",
        timeout: 60000
      }
    });
    return !!a;
  } catch (e) { return false; }
  finally { bioBusy = false; }
}
async function bioEnroll() {
  if (!bioSupported() || !me || bioBusy) return false;
  bioBusy = true;
  try {
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(16)),
        rp: { name: "My Notes", id: location.hostname },
        user: { id: new TextEncoder().encode(me.uid).slice(0, 64), name: me.email || "user", displayName: "User" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000
      }
    });
    if (cred) {
      localStorage.setItem(BIO_KEY, [...new Uint8Array(cred.rawId)].map(b => b.toString(16).padStart(2, "0")).join(""));
      return true;
    }
    return false;
  } catch (e) { return false; }
  finally { bioBusy = false; }
}

/* ---------- ডায়নামিক PIN সিস্টেম ---------- */
let pinBuf = "", pinFirst = null, authStep = "pin", bioPassed = false, lockTicker = null, oldTicker = null;

async function hashPin(p) {
  const data = new TextEncoder().encode("couple_chat_v1:" + me.uid + ":" + p);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function timePin(minus) {
  const d = new Date();
  let t = (d.getHours() * 60 + d.getMinutes() - minus) % 1440;
  if (t < 0) t += 1440;
  return String(Math.floor(t / 60)).padStart(2, "0") + String(t % 60).padStart(2, "0");
}
function dynamicMinus() {
  return localStorage.getItem(PIN_MODE_KEY) === "offset" ? (Number(localStorage.getItem(PIN_OFFSET_KEY)) || 0) : 0;
}
async function verifyPin(entered) {
  if (localStorage.getItem(PIN_MODE_KEY) === "custom")
    return (await hashPin(entered)) === localStorage.getItem(PIN_KEY);
  return entered === timePin(dynamicMinus());
}
function applyMode(mode, off) {
  localStorage.setItem(PIN_MODE_KEY, mode);
  if (mode === "offset") localStorage.setItem(PIN_OFFSET_KEY, String(off));
  else localStorage.removeItem(PIN_OFFSET_KEY);
  if (mode !== "custom") localStorage.removeItem(PIN_KEY);
}
function buildPad() {
  const pad = $("pad"); pad.innerHTML = "";
  const keys = ["1","2","3","4","5","6","7","8","9","","0","del"];
  keys.forEach(k => {
    const b = document.createElement("button");
    b.type = "button";
    if (k === "") b.className = "ghost";
    else if (k === "del") b.innerHTML = svgHtml("backspace", "ico");
    else b.textContent = k;
    if (k !== "") b.onclick = () => pressKey(k);
    pad.appendChild(b);
  });
}
function renderDots() {
  [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i < pinBuf.length));
}
function setPinUi(step) {
  authStep = step;
  const showPad = step === "pin" || step === "setup";
  $("dots").style.display = showPad ? "flex" : "none";
  $("pad").style.display = showPad ? "grid" : "none";
  const showBio = step === "bio" || step === "enroll";
  $("bioBtn").style.display = showBio ? "inline-flex" : "none";
  $("bioBtn").innerHTML = step === "enroll" ? E.bioEnrollBtn : E.bioVerifyBtn;
  const msgs = { choose: "", bio: E.bioVerify, pin: E.enterPin, setup: E.setPin, enroll: E.bioEnroll, locked: "" };
  $("pinMsg").textContent = msgs[step] || "";
}
function showUnsupported() {
  $("pinMsg").textContent = E.bioUnsupported;
  $("bioBtn").style.display = "none";
  $("dots").style.display = "none"; $("pad").style.display = "none";
}
function showLocked() {
  setPinUi("locked");
  const tick = () => {
    const r = lockRemaining();
    if (r <= 0) { clearInterval(lockTicker); if ($("pin").classList.contains("active")) startPin(); return; }
    $("pinMsg").textContent = E.lockedIn(fmtMs(r));
  };
  tick(); lockTicker = setInterval(tick, 1000);
}
function startPin() {
  clearInterval(lockTicker);
  pinBuf = ""; pinFirst = null; bioPassed = false; renderDots();
  show("pin");
  if (!localStorage.getItem(PIN_MODE_KEY)) {
    localStorage.removeItem(BIO_KEY);
    setPinUi("choose");
    openPinChoose("first");
    return;
  }
  if (lockRemaining() > 0) { showLocked(); return; }
  if (localStorage.getItem(BIO_KEY)) runBioStep();
  else setPinUi("pin");
}
function runBioStep() {
  setPinUi("bio");
  if (!bioSupported()) { showUnsupported(); return; }
  setTimeout(() => {
    if ($("pin").classList.contains("active") && authStep === "bio") doBioVerify();
  }, 350);
}
async function doBioVerify() {
  if (authStep !== "bio") return;
  const ok = await bioCheck();
  if (authStep !== "bio" || !$("pin").classList.contains("active")) return;
  if (ok) { bioPassed = true; pinBuf = ""; renderDots(); setPinUi("pin"); }
  else toast(E.bioFail);
}
function goEnroll() {
  setPinUi("enroll");
  if (!bioSupported()) { showUnsupported(); return; }
  setTimeout(() => {
    if ($("pin").classList.contains("active") && authStep === "enroll") doEnroll();
  }, 350);
}
async function doEnroll() {
  if (authStep !== "enroll") return;
  if (!bioSupported()) { showUnsupported(); return; }
  const ok = await bioEnroll();
  if (authStep !== "enroll") return;
  if (ok) { bioPassed = true; toast(E.bioDone); unlock(); }
  else toast(E.bioFail);
}
$("bioBtn").onclick = () => { if (authStep === "enroll") doEnroll(); else doBioVerify(); };

function afterPinOk() {
  if (!localStorage.getItem(BIO_KEY)) goEnroll();
  else if (bioPassed) unlock();
  else startPin();
}
async function pressKey(k) {
  if (authStep !== "pin" && authStep !== "setup") return;
  if (authStep === "pin" && lockRemaining() > 0) { startPin(); return; }
  if (k === "del") { pinBuf = pinBuf.slice(0, -1); renderDots(); return; }
  if (pinBuf.length >= 4) return;
  pinBuf += k; renderDots();
  if (pinBuf.length < 4) return;

  const entered = pinBuf;
  if (authStep === "setup") {
    if (pinFirst === null) {
      pinFirst = entered; pinBuf = ""; setTimeout(renderDots, 120);
      $("pinMsg").textContent = E.confirmPin;
    } else if (pinFirst === entered) {
      applyMode("custom");
      localStorage.setItem(PIN_KEY, await hashPin(entered));
      resetLock();
      pinBuf = ""; renderDots();
      goEnroll();
    } else {
      pinFirst = null; pinBuf = ""; setTimeout(renderDots, 120);
      $("pinMsg").textContent = E.mismatchPin; shake();
    }
  } else {
    if (await verifyPin(entered)) {
      resetLock();
      pinBuf = ""; renderDots();
      afterPinOk();
    } else {
      pinBuf = ""; setTimeout(renderDots, 120); shake();
      const mins = registerWrong();
      if (mins) startPin();
      else $("pinMsg").textContent = E.wrongPin1;
    }
  }
}
function shake() { const d = $("dots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); }
function unlock() { clearInterval(lockTicker); unlocked = true; pinBuf = ""; enterChat(); renderIncoming(); }

const mediaCol = () => collection(db, "chats", CHAT_ID, "media");
const mediaCache = new Map();
const mediaLoading = new Set();
const mediaEls = new Map();

async function urlFromData(dataUrl) {
  const blob = await (await fetch(dataUrl)).blob();
  return URL.createObjectURL(blob);
}
async function saveMediaChunks(dataUrl) {
  const mediaRef = doc(mediaCol());
  const chunks = [];
  for (let i = 0; i < dataUrl.length; i += CHUNK_CHARS) chunks.push(dataUrl.slice(i, i + CHUNK_CHARS));
  try {
    await setDoc(mediaRef, { ownerId: me.uid, total: chunks.length, createdAt: serverTimestamp() });
    for (let i = 0; i < chunks.length; i++) {
      await setDoc(doc(collection(mediaRef, "chunks"), String(i).padStart(3, "0")), { idx: i, data: chunks[i] });
    }
  } catch (e) { deleteMediaById(mediaRef.id); throw e; }
  return mediaRef.id;
}
async function ensureMedia(mediaId) {
  if (!mediaId || mediaCache.has(mediaId) || mediaLoading.has(mediaId)) return;
  mediaLoading.add(mediaId);
  try {
    const cSnap = await getDocs(collection(mediaCol(), mediaId, "chunks"));
    const full = cSnap.docs.map(d => d.data()).sort((a, b) => a.idx - b.idx).map(x => x.data).join("");
    mediaCache.set(mediaId, full ? await urlFromData(full) : "");
  } catch (e) {
    errOnce("Media load failed", e);
    setTimeout(() => mediaLoading.delete(mediaId), 8000);
    return;
  }
  mediaLoading.delete(mediaId);
  if (me && unlocked) render(false);
}
async function deleteMediaById(mediaId) {
  if (!mediaId) return;
  const u = mediaCache.get(mediaId);
  if (u) { try { URL.revokeObjectURL(u); } catch (e) {} }
  mediaCache.delete(mediaId);
  try {
    const mRef = doc(mediaCol(), mediaId);
    const cSnap = await getDocs(collection(mRef, "chunks"));
    const batch = writeBatch(db);
    cSnap.docs.forEach(d => batch.delete(d.ref));
    batch.delete(mRef);
    await batch.commit();
  } catch (e) { toast(T("mediaDelErr")); }
}
function placeholder(txt) {

}

async function compressImage(file) {
  const bmp = await createImageBitmap(file);
  const maxDim = 1280;
  let { width: w, height: h } = bmp;
  if (w > maxDim || h > maxDim) {
    const ratio = Math.min(maxDim / w, maxDim / h);
    w = Math.round(w * ratio); h = Math.round(h * ratio);
  }
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(bmp, 0, 0, w, h);
  bmp.close();
  let q = 0.72;
  let dataUrl = canvas.toDataURL("image/jpeg", q);
  while (dataUrl.length * 0.75 > 420000 && q > 0.35) {
    q -= 0.1;
    dataUrl = canvas.toDataURL("image/jpeg", q);
  }
  return dataUrl;
}

const baseType = (t, fallback) => String(t || fallback).split(";")[0];
function blobToDataUrl(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result);
      res("data:" + baseType(blob.type, "application/octet-stream") + ";base64," + s.slice(s.lastIndexOf(",") + 1));
    };
    r.onerror = rej; r.readAsDataURL(blob);
  });
}

  try {

    recChunks = []; recSec = 0; discardRec = false;
    const opts = { audioBitsPerSecond: 32000 };
    if (MediaRecorder.isTypeSupported("audio/webm")) opts.mimeType = "audio/webm";
    const rec = new MediaRecorder(stream, opts);
    mr = rec;
    rec.ondataavailable = e => { if (e.data && e.data.size > 0) recChunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(tr => tr.stop());
      clearInterval(recTicker); recTicker = null;
      $("recBar").classList.remove("show");
      mr = null;
      if (discardRec || !recChunks.length || !me) return;
      const blob = new Blob(recChunks, { type: baseType(rec.mimeType, "audio/webm") });
      if (blob.size > 700000) { toast(T("audBig")); return; }
      sendMedia("audio", await blobToDataUrl(blob), { duration: recSec });
    };
    rec.start(500);
    $("recTimer").textContent = "00:00";
    $("recBar").classList.add("show");
    recTicker = setInterval(() => {
      recSec++;

const settingsRef = () => doc(db, "chats", CHAT_ID, "meta", "settings");
let autoDelete = false, enabledAtMs = 0, settingsUnsub = null, sweepTimer = null;
const deleting = new Set();
const stamping = new Set();

function startSettings() {
  if (settingsUnsub) return;
  settingsUnsub = onSnapshot(settingsRef(), s => {
    const data = s.exists() ? s.data({ serverTimestamps: "estimate" }) : {};
    autoDelete = !!data.autoDelete;
    enabledAtMs = data.enabledAt ? data.enabledAt.toMillis() : (autoDelete ? Date.now() : 0);
    if (autoDelete && !data.enabledAt) {
      setDoc(settingsRef(), { enabledAt: serverTimestamp() }, { merge: true }).catch(() => {});
    }
    renderAd(); sweep();
  }, e => errOnce("Settings failed", e));
  if (!sweepTimer) sweepTimer = setInterval(sweep, 1000);
}
function stopSettings() {
  if (settingsUnsub) { settingsUnsub(); settingsUnsub = null; }
  clearInterval(sweepTimer); sweepTimer = null;
  autoDelete = false; enabledAtMs = 0;
}
function renderAd() {
  $("adBtn").textContent = autoDelete ? T("turnOff") : T("turnOn");
  if (me && unlocked) render(false);
}
function eligible(m) { return autoDelete && m.seenAt && m.seenAt.toMillis() >= enabledAtMs; }
const leftSec = seenMs => Math.max(0, Math.ceil((seenMs + AUTO_DELETE_MS - Date.now()) / 1000));

function sweep() {
  if (!me || !autoDelete) return;
  const now = Date.now();
  lastDocs.forEach(d => {
    const m = d.data({ serverTimestamps: "estimate" });
    if (m.senderId === me.uid && m.status === "seen" && !m.seenAt && !stamping.has(d.id)
        && m.createdAt && m.createdAt.toMillis() >= enabledAtMs) {
      stamping.add(d.id);
      updateDoc(d.ref, { seenAt: serverTimestamp() })
        .catch(e => { errOnce("seenAt failed", e); setTimeout(() => stamping.delete(d.id), 15000); });
      return;
    }
    if (deleting.has(d.id)) return;
    if (eligible(m) && now - m.seenAt.toMillis() >= AUTO_DELETE_MS) {
      deleting.add(d.id);
      const mid = m.mediaId;
      deleteDoc(d.ref)
        .then(async () => { if (mid) await deleteMediaById(mid); deleting.delete(d.id); })
        .catch(e => { errOnce("Delete failed", e); setTimeout(() => deleting.delete(d.id), 15000); });
    }
  });
  document.querySelectorAll(".cd").forEach(el => {
    el.textContent = leftSec(Number(el.dataset.seen)) + "s";
  });
}
$("adBtn").onclick = () => {
  const next = !autoDelete;
  const data = next ? { autoDelete: true, enabledAt: serverTimestamp() } : { autoDelete: false };
  setDoc(settingsRef(), data, { merge: true })

    const ob = document.createElement("button");
    ob.className = "older";
    ob.innerHTML = `${svgHtml("arrow-up", "ico ico-sm")} <span>${T("olderBtn")}</span>`;
    ob.onclick = loadOlder;
    frag.appendChild(ob);
  }
  if (!visibleDocs.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = T("emptyChat"); frag.appendChild(e);
  }

  visibleDocs.forEach(d => {
    const m = d.data({ serverTimestamps: "estimate" });
    const when = m.createdAt ? m.createdAt.toDate() : new Date();
    const key = when.toDateString();
    if (key !== lastDay) {
      lastDay = key;
      const s = document.createElement("div"); s.className = "day"; s.textContent = dayLabel(when); frag.appendChild(s);
    }

    if (m.type === "call") {
      const r = document.createElement("div"); r.className = "callLog"; r.dataset.mid = d.id;
      const ic = document.createElement("span");
      ic.innerHTML = svgHtml(m.callType === "video" ? "video" : "phone", "ico ico-sm");
      const t = document.createElement("span"); t.textContent = callText(m);
      const tm = document.createElement("small"); tm.className = "num-tab"; tm.textContent = fmtTime(when);
      r.append(ic.firstChild, t, tm);
      if (eligible(m)) r.appendChild(cdSpan(m));
      frag.appendChild(r);
      return;
    }

    const mine = m.senderId === me.uid;
    const row = document.createElement("div"); row.className = "row" + (mine ? " me" : ""); row.dataset.mid = d.id;
    const b = document.createElement("div"); b.className = "b";

    if (m.replyTo) {
      const q = document.createElement("div"); q.className = "q";
      const who = document.createElement("b"); who.textContent = m.replyTo.from === me.uid ? T("you") : T("partner");
      const sp = document.createElement("span"); sp.textContent = m.replyTo.text || "";
      q.append(who, sp);
      q.onclick = e => { e.stopPropagation(); jumpTo(m.replyTo.id); };
      b.appendChild(q);
    }

    if ((m.type === "image" || m.type === "audio" || m.type === "video") && m.mediaId) {
      b.appendChild(mediaNode(d.id, m));
    }

    if (m.text) {
      const tx = document.createElement("div"); tx.className = "tx"; tx.textContent = m.text;
      b.appendChild(tx);
    }

    const meta = document.createElement("div"); meta.className = "meta num-tab";
    if (eligible(m)) meta.appendChild(cdSpan(m));
    const time = document.createElement("span"); time.textContent = fmtTime(when); meta.appendChild(time);
    if (mine) {
      const t = document.createElement("span");
      const st = m.status || "sent";
      t.className = "tick" + (st === "seen" ? " seen" : "");
      t.textContent = st === "sent" ? "✓" : "✓✓";
      meta.appendChild(t);
    }
    b.appendChild(meta);

    const vals = Object.values(m.reactions || {});
    if (vals.length) {
      const wrap = document.createElement("div"); wrap.className = "rxs";
      const counts = {};
      vals.forEach(e => counts[e] = (counts[e] || 0) + 1);
      Object.entries(counts).forEach(([e, n]) => {
        const s = document.createElement("span"); s.className = "rp"; s.textContent = e;
        if (n > 1) { const sm = document.createElement("small"); sm.textContent = n; s.appendChild(sm); }
        wrap.appendChild(s);
      });
      b.appendChild(wrap);
    }

    attachLongPress(b, d.id);
    row.appendChild(b); frag.appendChild(row);
  });

  const ids = new Set(lastDocs.map(x => x.id));
  [...mediaEls.keys()].forEach(k => { if (!ids.has(k)) mediaEls.delete(k); });

  list.replaceChildren(frag);
  if (keepAnchor) { keepAnchor = false; list.scrollTop = prevTop + (list.scrollHeight - prevH); }
  else if (forceBottom || nearBottom) list.scrollTop = list.scrollHeight;
}

function jumpTo(id) {
  const el = $("list").querySelector('[data-mid="' + id + '"]');
  if (!el) { toast(T("noOrig")); return; }
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  el.classList.add("hl"); setTimeout(() => el.classList.remove("hl"), 1500);
}

/* ---------- মেসেজ মেনু ও ডিলিট অপশন ---------- */
let sheetFor = null, replyTo = null;

function attachLongPress(el, id) {
  let timer;
  el.addEventListener("touchstart", () => { timer = setTimeout(() => openSheet(id), 500); }, { passive: true });
  ["touchend", "touchmove", "touchcancel"].forEach(ev =>
    el.addEventListener(ev, () => clearTimeout(timer), { passive: true }));
  el.addEventListener("contextmenu", e => { e.preventDefault(); openSheet(id); });
}
function openSheet(id) {
  if (modalOpen || $("sheet").classList.contains("show")) return;
  const d = lastDocs.find(x => x.id === id); if (!d) return;
  const m = d.data();
  sheetFor = { id, ref: d.ref, m };
  const mineReact = (m.reactions || {})[me.uid];
  const row = $("rxRow"); row.innerHTML = "";
  REACTIONS.forEach(em => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = em; if (mineReact === em) b.className = "sel";
    b.onclick = () => { closeSheet(); toggleReaction(d.ref, mineReact, em); };
    row.appendChild(b);
  });
  $("sheet").classList.add("show");
}
function closeSheet() { $("sheet").classList.remove("show"); }
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

function closeDelSheet() { $("delSheet").classList.remove("show"); }
$("delSheet").addEventListener("click", e => { if (e.target.id === "delSheet") closeDelSheet(); });
$("delCancel").onclick = closeDelSheet;

function toggleReaction(ref, current, em) {
  const key = "reactions." + me.uid;
  updateDoc(ref, current === em ? { [key]: deleteField() } : { [key]: em })
    .catch(e => errOnce("Reaction failed", e));
}
$("shReply").onclick = () => {
  if (!sheetFor) return;
  const m = sheetFor.m;
  const preview = m.text || (m.type === "image" ? "Photo" : m.type === "audio" ? "Voice" : m.type === "video" ? "Video" : "");
  replyTo = { id: sheetFor.id, text: preview.slice(0, 80), from: m.senderId };
  closeSheet(); showReplyBar(); $("msg").focus();
};
$("shDel").onclick = () => {
  if (!sheetFor) return;
  const isMine = sheetFor.m.senderId === me.uid;
  closeSheet();
  $("delBoth").style.display = isMine ? "block" : "none";
  $("delSheet").classList.add("show");
};
$("delMe").onclick = () => {
  const s = sheetFor; closeDelSheet();
  if (!s) return;
  updateDoc(s.ref, { hiddenFor: arrayUnion(me.uid) }).catch(e => errOnce("Delete for me failed", e));
};
$("delBoth").onclick = () => {
  const s = sheetFor; closeDelSheet();
  if (!s || s.m.senderId !== me.uid) return;
  const mid = s.m.mediaId;
  deleteDoc(s.ref)
    .then(async () => { if (mid) await deleteMediaById(mid); })
    .catch(e => errOnce("Delete failed", e));
};

function showReplyBar() {
  const bar = $("replyBar");
  if (!replyTo) { bar.classList.remove("show"); return; }
  $("rbWho").textContent = replyTo.from === me.uid ? T("you") : T("partner");
  $("rbText").textContent = replyTo.text;
  bar.classList.add("show");
  $("list").scrollTop = $("list").scrollHeight;
}
$("rbClose").onclick = () => { replyTo = null; showReplyBar(); };

/* ---------- সব মেসেজ মোছা ---------- */
let clearing = false;
async function clearAll() {
  if (clearing || !me) return;
  clearing = true;
  try {
    while (true) {
      const snap = await getDocs(query(col(), limit(400)));
      if (snap.empty) break;
      for (const d of snap.docs) {
        const mid = d.data().mediaId;
        if (mid) await deleteMediaById(mid);
      }
      const batch = writeBatch(db);
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    mediaEls.clear();
    toast(T("allCleared"));
  } catch (e) {
    errOnce("Clear failed", e);
  }
  clearing = false;
}
$("clearBtn").onclick = clearAll;

/* ---------- মেসেজ পাঠানো ---------- */
const msg = $("msg");
function grow() { msg.style.height = "auto"; msg.style.height = Math.min(msg.scrollHeight, 120) + "px"; }
msg.addEventListener("input", () => {
  grow();
  if (msg.value.trim()) {
    const now = Date.now();
    if (now - lastTypingWrite > 2500) setTyping(true);
    clearTimeout(typingStop);
    typingStop = setTimeout(() => setTyping(false), 4000);
  } else {
    clearTimeout(typingStop); setTyping(false);
  }
});
msg.addEventListener("blur", () => { clearTimeout(typingStop); setTyping(false); });

function send() {
  const text = msg.value.trim();
  if (!text || !me) return;
  msg.value = ""; grow(); msg.focus();
  clearTimeout(typingStop); setTyping(false);
  const payload = { type: "text", text, senderId: me.uid, createdAt: serverTimestamp(), status: "sent", hiddenFor: [] };
  if (replyTo) { payload.replyTo = replyTo; replyTo = null; showReplyBar(); }
  addDoc(col(), payload).catch(e => errOnce("Send failed", e));
  setTimeout(() => { $("list").scrollTop = $("list").scrollHeight; }, 50);
}
$("sendBtn").onclick = send;
$("sendBtn").addEventListener("mousedown", e => e.preventDefault());

if (window.visualViewport) {
  visualViewport.addEventListener("resize", () => {
    $("chat").style.height = visualViewport.height + "px";
    $("list").scrollTop = $("list").scrollHeight;
  });
}

/* ---------- ভয়েস / ভিডিও কল (WebRTC) ---------- */
const callsCol = () => collection(db, "chats", CHAT_ID, "calls");
let call = null, incoming = null, ringUnsub = null, busy = false;

async function getIceServers() {
  try {
    const s = await getDoc(doc(db, "config", "ice"));
    if (s.exists()) {
      const arr = JSON.parse(s.data().json);
      if (Array.isArray(arr) && arr.length) return arr;
    }
  } catch (e) {}
  return [{ urls: "stun:stun.l.google.com:19302" }];
}
function getMedia(type) {
  return navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true },
    video: type === "video" ? { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } : false
  });
}
let ringTimer = null, actx = null;
function startRing() {
  if (ringTimer) return;
  const beep = () => {
    try {
      if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 440; g.gain.value = 0.15;
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.35);
    } catch (e) {}
  };
  beep(); ringTimer = setInterval(beep, 1800);
}
function stopRing() { clearInterval(ringTimer); ringTimer = null; }

function startRingListener() {
  if (ringUnsub) return;
  const q = query(callsCol(), where("status", "==", "ringing"));
  ringUnsub = onSnapshot(q, snap => {
    incoming = null;
    snap.docs.forEach(d => {
      const m = d.data({ serverTimestamps: "estimate" });
      const age = Date.now() - (m.createdAt ? m.createdAt.toMillis() : Date.now());
      if (m.from === me.uid) {
        if (age > 90000 && !(call && call.ref.id === d.id)) updateDoc(d.ref, { status: "ended" }).catch(() => {});
        return;
      }
      if (age < 90000 && !call) incoming = { ref: d.ref, id: d.id, type: m.type, offer: m.offer };
    });
    renderIncoming();
  }, () => {});
}
function stopCalls() {
  endCall(false);
  if (ringUnsub) { ringUnsub(); ringUnsub = null; }
  incoming = null; renderIncoming();
}
function renderIncoming() {
  const showIt = !!(incoming && unlocked && !call);
  $("incoming").classList.toggle("show", showIt);
  $("incType").textContent = incoming ? (incoming.type === "video" ? T("inVideo") : T("inVoice")) : "";
  if (showIt) startRing(); else stopRing();
}
function setCallStatus(t) {
  $("callStatus").textContent = t;
  $("miniTime").textContent = t || "";
}

let histDepth = 0;
function pushCallState() { try { history.pushState({ ccCall: 1 }, ""); histDepth++; } catch (e) {} }
function unwindHistory() {
  if (histDepth > 0) { const n = histDepth; histDepth = 0; try { history.go(-n); } catch (e) {} }
}
function setMini(on) {
  if (!call) return;
  call.mini = on;
  const el = $("call");
  el.classList.toggle("mini", on);
  if (!on) el.style.left = el.style.top = el.style.right = el.style.bottom = "";
}
window.addEventListener("popstate", () => {
  if (!call) return;
  if (histDepth > 0) histDepth--;
  if (!call.mini) setMini(true);
  pushCallState();
});
$("minBtn").onclick = () => setMini(true);
$("callExit").onclick = () => $("logoutBtn").click();

(function () {
  const el = $("call");
  let down = false, moving = false, sx = 0, sy = 0, ox = 0, oy = 0;
  el.addEventListener("pointerdown", e => {
    if (!call || !call.mini || e.target.closest("#miniHang")) return;
    down = true; moving = false; sx = e.clientX; sy = e.clientY;
    const r = el.getBoundingClientRect(); ox = r.left; oy = r.top;
    try { el.setPointerCapture(e.pointerId); } catch (x) {}
  });
  el.addEventListener("pointermove", e => {
    if (!down) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moving && Math.hypot(dx, dy) < 8) return;
    moving = true;
    const x = Math.min(Math.max(0, ox + dx), window.innerWidth - el.offsetWidth);
    const y = Math.min(Math.max(0, oy + dy), window.innerHeight - el.offsetHeight);
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.right = "auto"; el.style.bottom = "auto";
  });
  el.addEventListener("pointerup", () => {
    if (!down) return; down = false; if (!moving) setMini(false);
  });
  el.addEventListener("pointercancel", () => { down = false; });
})();

async function openCallUI(type, status) {
  $("call").classList.toggle("vid", type === "video");
  $("call").classList.remove("mini");
  $("call").classList.add("show");
  $("muteBtn").classList.remove("off"); $("muteBtn").innerHTML = svgHtml("mic", "ico ico-lg");
  $("camBtn").classList.remove("off"); $("camBtn").innerHTML = svgHtml("video", "ico ico-lg");
  setCallStatus(status);
  pushCallState();
  if (type === "video" && call) {
    $("localV").srcObject = new MediaStream(call.stream.getVideoTracks());
    $("localV").play().catch(() => {});
  }
  try { if (navigator.wakeLock && call) call.wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}
async function applyRemote(c, desc) {
  await c.pc.setRemoteDescription(new RTCSessionDescription(desc));
  c.remoteSet = true;
  clearTimeout(c.ringTimeout);
  c.pending.splice(0).forEach(x => c.pc.addIceCandidate(new RTCIceCandidate(x)).catch(() => {}));
}
async function setupPeer(callRef, type, stream, role) {
  const pc = new RTCPeerConnection({ iceServers: await getIceServers() });
  const c = { ref: callRef, pc, stream, type, role, unsubs: [], pending: [],
              remoteSet: false, gotAnswer: false, docSeen: false, mini: false, logged: false, result: null,
              timer: null, ringTimeout: null, startedAt: 0, wake: null };
  call = c;
  stream.getTracks().forEach(tr => pc.addTrack(tr, stream));
  pc.ontrack = e => { $("remoteV").srcObject = e.streams[0]; $("remoteV").play().catch(() => {}); };
  pc.onicecandidate = e => {
    if (e.candidate) addDoc(collection(callRef, "candidates"), { from: me.uid, c: e.candidate.toJSON() }).catch(() => {});
  };
  pc.onconnectionstatechange = () => {
    if (call !== c) return;
    const s = pc.connectionState;
    if (s === "connected") { c.startedAt = Date.now(); startTimer(c); }
    else if (s === "disconnected") setCallStatus(T("weakConn"));
    else if (s === "failed") { toast(T("turnHint")); c.result = "failed"; endCall(true); }
  };
  c.unsubs.push(onSnapshot(collection(callRef, "candidates"), snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type !== "added") return;
      const d = ch.doc.data();
      if (d.from === me.uid) return;
      if (c.remoteSet) pc.addIceCandidate(new RTCIceCandidate(d.c)).catch(() => {});
      else c.pending.push(d.c);
    });
  }));
  c.unsubs.push(onSnapshot(callRef, snap => {
    if (!snap.exists()) { if (c.docSeen) endCall(false); return; }
    c.docSeen = true;
    const m = snap.data();
    if (m.status === "declined") { toast(T("callDeclined")); c.result = "declined"; endCall(false); }
    else if (m.status === "ended" || m.status === "missed") {
      toast(T("callEnded"));
      if (m.status === "missed") c.result = "missed";
      endCall(false);
    } else if (c.role === "caller" && m.answer && !c.gotAnswer) {
      c.gotAnswer = true;
      setCallStatus(T("connecting"));
      applyRemote(c, m.answer).catch(() => {});
    }
  }));
  return c;
}
function startTimer(c) {
  clearInterval(c.timer);
  const tick = () => setCallStatus(fmtDur(Math.floor((Date.now() - c.startedAt) / 1000)));
  tick(); c.timer = setInterval(tick, 1000);
}
async function startCall(type) {
  if (call || busy || !me) return;
  if (mr || vrStream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast(T("noCallSup")); return; }
  busy = true;
  let stream = null;
  try {
    try { stream = await getMedia(type); }
    catch (e) { toast(T("permMedia")); return; }
    const ref = doc(callsCol());
    const c = await setupPeer(ref, type, stream, "caller");
    openCallUI(type, T("calling"));
    const offer = await c.pc.createOffer();
    await c.pc.setLocalDescription(offer);
    await setDoc(ref, { from: me.uid, type, status: "ringing", createdAt: serverTimestamp(),
                        offer: { type: offer.type, sdp: offer.sdp } });
    c.ringTimeout = setTimeout(() => {
      if (call === c && !c.remoteSet) {
        toast(T("noAnswer")); c.result = "missed";
        updateDoc(ref, { status: "missed" }).catch(() => {});
        endCall(false);
      }
    }, 45000);
  } catch (e) {
    toast(T("failedConn"));
    if (call) { call.result = "failed"; endCall(false); }
    else if (stream) stream.getTracks().forEach(tr => tr.stop());
  } finally { busy = false; }
}
async function acceptCall() {
  if (!incoming || call || busy) return;
  const inc = incoming; incoming = null;
  renderIncoming();
  busy = true;
  let stream = null;
  try {
    try { stream = await getMedia(inc.type); }
    catch (e) {
      toast(T("permMedia"));
      updateDoc(inc.ref, { status: "declined" }).catch(() => {});
      return;
    }
    const c = await setupPeer(inc.ref, inc.type, stream, "callee");
    openCallUI(inc.type, T("connecting"));
    await applyRemote(c, inc.offer);
    const ans = await c.pc.createAnswer();
    await c.pc.setLocalDescription(ans);
    await updateDoc(inc.ref, { status: "accepted", answer: { type: ans.type, sdp: ans.sdp } });
  } catch (e) {
    toast(T("failedConn"));
    if (call) { call.result = "failed"; endCall(false); }
    else if (stream) stream.getTracks().forEach(tr => tr.stop());
  } finally { busy = false; }
}
async function declineCall() {
  if (!incoming) return;
  const inc = incoming; incoming = null;
  renderIncoming();
  try { await updateDoc(inc.ref, { status: "declined" }); } catch (e) {}
  if (me) {
    addDoc(col(), { type: "call", callType: inc.type, result: "declined", senderId: inc.ref.id ? me.uid : me.uid,
      createdAt: serverTimestamp(), status: "sent", hiddenFor: [] }).catch(() => {});
  }
}
function endCall(notifyRemote) {
  const c = call;
  if (!c) {
    $("call").classList.remove("show", "vid", "mini");
    return;
  }
  call = null;
  clearTimeout(c.ringTimeout);
  clearInterval(c.timer);
  c.unsubs.forEach(u => { try { u(); } catch (e) {} });
  if (c.wake) { try { c.wake.release(); } catch (e) {} }
  if (c.stream) c.stream.getTracks().forEach(tr => { try { tr.stop(); } catch (e) {} });
  try { c.pc.close(); } catch (e) {}
  $("remoteV").srcObject = null;
  $("localV").srcObject = null;
  $("call").classList.remove("show", "vid", "mini");
  unwindHistory();
  if (notifyRemote && c.ref) {
    const nextStatus = c.startedAt ? "ended" : (c.role === "caller" ? "missed" : "declined");
    updateDoc(c.ref, { status: nextStatus }).catch(() => {});
  }
  if (!c.logged && me) {
    c.logged = true;
    const dur = c.startedAt ? Math.max(1, Math.round((Date.now() - c.startedAt) / 1000)) : 0;
    const res = c.result || (c.startedAt ? "ended" : (c.role === "caller" ? "cancelled" : "declined"));
    addDoc(col(), { type: "call", callType: c.type, result: res, duration: dur, senderId: me.uid,
      createdAt: serverTimestamp(), status: "sent", hiddenFor: [] }).catch(() => {});
  }
  renderIncoming();
}

$("callV").onclick = () => startCall("audio");
$("callVid").onclick = () => startCall("video");
$("acceptBtn").onclick = acceptCall;
$("declineBtn").onclick = declineCall;
$("hangBtn").onclick = () => endCall(true);
$("miniHang").onclick = e => { e.stopPropagation(); endCall(true); };
$("muteBtn").onclick = () => {
  if (!call || !call.stream) return;
  const tracks = call.stream.getAudioTracks();
  if (!tracks.length) return;
  const nextMuted = tracks[0].enabled;
  tracks.forEach(tr => { tr.enabled = !nextMuted; });
  $("muteBtn").classList.toggle("off", nextMuted);
  $("muteBtn").innerHTML = svgHtml(nextMuted ? "mic-off" : "mic", "ico ico-lg");
};
$("camBtn").onclick = () => {
  if (!call || !call.stream) return;
  const tracks = call.stream.getVideoTracks();
  if (!tracks.length) return;
  const nextOff = tracks[0].enabled;
  tracks.forEach(tr => { tr.enabled = !nextOff; });
  $("camBtn").classList.toggle("off", nextOff);
  $("camBtn").innerHTML = svgHtml(nextOff ? "video-off" : "video", "ico ico-lg");
};
</script>
